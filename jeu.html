<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Objectif BC — Le jeu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0f1a3a;
      --navy2: #1d2c5e;
      --ink: #0b1026;
      --gold: #f4c430;
      --gold2: #ffdd66;
      --red: #e94545;
      --green: #3cc76a;
      --paper: #fdf8ec;
      --px: 'Press Start 2P', ui-monospace, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; background: var(--ink); color: #fff;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; touch-action: manipulation;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
    #app { position: fixed; inset: 0; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }

    /* ---------- HUD ---------- */
    #hud { display: flex; align-items: center; gap: 7px; padding: 8px 10px; background: var(--navy);
      border-bottom: 3px solid #000; box-shadow: inset 0 -3px 0 #2a3c78; }
    #hudAvatar { width: 40px; height: 49px; image-rendering: pixelated; background: #2a3c78;
      border: 2px solid #000; border-radius: 6px; flex: none; }
    #hudMid { flex: 1; min-width: 0; }
    #hudRank { font-family: var(--px); font-size: 9px; line-height: 1.5; color: var(--gold2);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .xpbar { position: relative; height: 12px; background: #000; border: 2px solid #000; border-radius: 3px;
      margin-top: 4px; overflow: hidden; }
    .xpbar > i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(#7ee0ff, #2a9fd6);
      transition: width .6s ease; }
    .xpbar > span { position: absolute; inset: 0; font-family: var(--px); font-size: 7px; line-height: 8px;
      text-align: center; color: #fff; text-shadow: 1px 1px 0 #000; }
    #hudHearts { font-size: 11px; margin-top: 3px; letter-spacing: 1px; }
    .hbtn { flex: none; width: 38px; height: 44px; border: 2px solid #000; border-radius: 6px; background: #2a3c78;
      color: #fff; font-size: 20px; box-shadow: inset 0 -3px 0 #16224a; cursor: pointer; }

    /* ---------- Monde ---------- */
    #stage { position: relative; flex: 1; min-height: 0; background: #000; }
    #world { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
    #toast { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); max-width: 92%;
      background: rgba(10,16,40,.92); border: 2px solid var(--gold); border-radius: 6px; padding: 8px 12px;
      font-family: var(--px); font-size: 9px; line-height: 1.6; text-align: center; opacity: 0;
      transition: opacity .25s; pointer-events: none; }
    #toast.show { opacity: 1; }
    #toast { z-index: 6; }
    #mini { position: absolute; inset: 0; z-index: 5; background: #000; display: none; align-items: center; justify-content: center; }
    #mini.show { display: flex; }
    #mcv { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; image-rendering: crisp-edges; image-rendering: pixelated; touch-action: none; }
    #mQuit { position: absolute; right: 6px; bottom: 6px; width: 38px; height: 38px; border-radius: 8px; border: 2px solid #000; background: rgba(42,60,120,.85); color: #fff; font-size: 16px; }

    /* ---------- Manette ---------- */
    #pad { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 10px 22px 14px;
      background: linear-gradient(#c9cbd3, #a9acb8); border-top: 3px solid #000; }
    #dpad { position: relative; width: 138px; height: 138px; }
    #dpad button { position: absolute; width: 46px; height: 46px; background: #2b2f3a; border: none; color: #8d93a5;
      font-size: 16px; box-shadow: inset 0 -4px 0 #15171d; }
    #dpad button:active, #dpad button.on { background: #1d2028; box-shadow: inset 0 2px 0 #000; }
    #dpad .u { left: 46px; top: 0; border-radius: 6px 6px 0 0; }
    #dpad .d { left: 46px; top: 92px; border-radius: 0 0 6px 6px; }
    #dpad .l { left: 0; top: 46px; border-radius: 6px 0 0 6px; }
    #dpad .r { left: 92px; top: 46px; border-radius: 0 6px 6px 0; }
    #dpad .c { position: absolute; left: 46px; top: 46px; width: 46px; height: 46px; background: #2b2f3a; }
    #abtns { display: flex; gap: 14px; align-items: center; transform: rotate(-18deg); }
    .rb { width: 62px; height: 62px; border-radius: 50%; border: none; background: #b3243a; color: #ffd0d6;
      font-family: var(--px); font-size: 14px; box-shadow: inset 0 -5px 0 #74121f, 0 3px 0 #555; }
    .rb.small { width: 50px; height: 50px; font-size: 10px; background: #3d4251; box-shadow: inset 0 -5px 0 #20232c, 0 3px 0 #555; color: #cfd3df; }
    .rb:active { transform: translateY(2px); box-shadow: inset 0 -2px 0 #74121f; }

    /* ---------- Fenêtres ---------- */
    .ov { position: fixed; inset: 0; z-index: 20; display: none; flex-direction: column; background: rgba(5,8,22,.86); }
    .ov.show { display: flex; }
    .win { background: var(--navy); border: 3px solid #000; box-shadow: inset 0 0 0 3px #3a56b0; border-radius: 8px; }
    .pxt { font-family: var(--px); }

    /* Dialogue */
    #dlg { justify-content: flex-end; background: transparent; pointer-events: none; z-index: 40; }
    #dlg .box { pointer-events: auto; margin: 0 auto 12px; width: calc(100% - 20px); max-width: 540px;
      background: var(--paper); color: #1a1a1a; border: 4px solid #1a1a1a; border-radius: 8px;
      box-shadow: inset 0 0 0 3px #c8b88a; padding: 14px; }
    #dlgWho { font-family: var(--px); font-size: 10px; color: #1d2c5e; margin-bottom: 8px; }
    #dlgTxt { font-size: 16px; line-height: 1.45; min-height: 46px; }
    #dlgBtns { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .btn { font-family: var(--px); font-size: 10px; padding: 12px 14px; border-radius: 6px; border: 3px solid #000;
      background: var(--gold); color: #1a1a1a; box-shadow: inset 0 -4px 0 #b88a00; cursor: pointer; }
    .btn.alt { background: #e5e5e5; box-shadow: inset 0 -4px 0 #a5a5a5; }
    .btn.blue { background: #3a6fe0; color: #fff; box-shadow: inset 0 -4px 0 #1d3f94; }
    .btn:active { transform: translateY(2px); }

    /* Combat */
    #battle { background: linear-gradient(#83b8f5 0, #cfe6ff 38%, #9bd17c 38%, #7cbc5c 100%); overflow-y: auto; }
    #bTop { display: flex; justify-content: space-between; align-items: flex-end; padding: 14px 14px 0; gap: 10px; }
    .plate { background: var(--paper); color: #1a1a1a; border: 3px solid #1a1a1a; border-radius: 8px 8px 8px 0;
      padding: 8px 10px; min-width: 150px; box-shadow: 4px 4px 0 rgba(0,0,0,.25); }
    .plate b { font-family: var(--px); font-size: 9px; display: block; margin-bottom: 6px; line-height: 1.4; }
    .hp { height: 8px; background: #333; border-radius: 4px; overflow: hidden; border: 2px solid #1a1a1a; }
    .hp > i { display: block; height: 100%; background: var(--green); transition: width .4s; }
    #eSprite, #pSprite { image-rendering: pixelated; flex: none; }
    #bMid { display: flex; justify-content: space-between; align-items: flex-end; padding: 0 14px; margin-top: -6px; }
    #pPlate { border-radius: 8px 8px 0 8px; }
    #bHearts { font-size: 15px; letter-spacing: 1px; }
    #bCombo { font-family: var(--px); font-size: 8px; color: #b33; margin-top: 6px; min-height: 10px; }
    #qbox { margin: 12px; background: var(--paper); color: #1a1a1a; border: 4px solid #1a1a1a; border-radius: 10px;
      box-shadow: inset 0 0 0 3px #c8b88a; padding: 14px; }
    #qMeta { font-family: var(--px); font-size: 8px; color: #6a5a2a; margin-bottom: 10px; line-height: 1.5; }
    .qprog { display: flex; align-items: center; gap: 10px; margin-top: 8px; padding: 6px 10px; background: #efe3c2; border-radius: 8px; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 700; color: #4a3f20; }
    .stars { display: inline-flex; gap: 1px; line-height: 1; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 0; vertical-align: middle; }
    .st { display: inline-block; width: 1em; text-align: center; }
    .st { color: #c9bfa6; -webkit-text-stroke: 1px #8a7b55; }
    .st.on { color: #f4c430; -webkit-text-stroke: 1px #9a6e00; text-shadow: 0 0 6px rgba(244,196,48,.6); }
    #qTxt { font-size: 17px; font-weight: 700; line-height: 1.4; margin-bottom: 12px; }
    #qOpts { display: flex; flex-direction: column; gap: 8px; }
    .opt { text-align: left; font-size: 15px; line-height: 1.35; padding: 12px; border-radius: 8px; border: 3px solid #1a1a1a;
      background: #fff; color: #1a1a1a; box-shadow: inset 0 -3px 0 #ccc; cursor: pointer; font-family: inherit; }
    .opt.ok { background: #c9f5d6; border-color: #18823d; box-shadow: inset 0 -3px 0 #7fd39c; }
    .opt.ko { background: #ffd2d2; border-color: #b51f1f; box-shadow: inset 0 -3px 0 #f19999; }
    .opt:disabled { cursor: default; }
    #qExp { display: none; margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: #eef3ff; border: 2px dashed #3a56b0;
      font-size: 14px; line-height: 1.45; }
    #qNext { display: none; margin-top: 12px; width: 100%; }
    .shake { animation: shake .35s; }
    @keyframes shake { 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
    .hit { animation: hit .5s; }
    @keyframes hit { 0%,100%{opacity:1} 25%,75%{opacity:.15} 50%{opacity:1} }
    .floatxp { position: fixed; z-index: 60; font-family: var(--px); font-size: 14px; color: var(--gold2);
      text-shadow: 2px 2px 0 #000; pointer-events: none; animation: fl 1.1s ease-out forwards; }
    @keyframes fl { from { opacity: 1; transform: translateY(0) } to { opacity: 0; transform: translateY(-60px) } }

    /* Résultat / promotion */
    #res, #evo { align-items: center; justify-content: center; padding: 16px; }
    #res .win, #evo .win { width: 100%; max-width: 420px; padding: 20px 16px; text-align: center; }
    #resTitle { font-size: 14px; line-height: 1.6; color: var(--gold2); }
    #resBody { margin: 14px 0; font-size: 15px; line-height: 1.6; }
    #resBody .big { font-family: var(--px); font-size: 20px; color: var(--gold2); display: block; margin: 8px 0; }
    #evoCanvas { image-rendering: pixelated; width: 162px; height: 198px; margin: 10px auto; display: block; }
    #evoTxt { font-size: 15px; line-height: 1.6; min-height: 72px; }
    #evoTxt b { color: var(--gold2); }

    /* Menu */
    #menu { padding: 12px; }
    #menu .win { flex: 1; display: flex; flex-direction: column; min-height: 0; max-width: 540px; width: 100%; margin: 0 auto; }
    #mTabs { display: flex; border-bottom: 3px solid #000; }
    #mTabs button { flex: 1; padding: 12px 2px; background: none; border: none; color: #9fb0e8; font-family: var(--px); font-size: 8px; }
    #mTabs button.on { color: var(--gold2); background: #24357a; }
    #mBody { flex: 1; overflow-y: auto; padding: 14px; -webkit-overflow-scrolling: touch; user-select: text; }
    #mClose { margin: 10px; }
    .rk { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; margin-bottom: 6px; background: #17244f; }
    .rk.cur { outline: 3px solid var(--gold); }
    .rk.lock { opacity: .45; }
    .rk canvas { width: 40px; height: 49px; image-rendering: pixelated; flex: none; }
    .rk .n { font-family: var(--px); font-size: 9px; line-height: 1.5; }
    .rk .s { font-size: 12px; color: #aab6e0; margin-top: 3px; }
    .th { margin-bottom: 14px; }
    .th .n { font-size: 14px; font-weight: 700; display: flex; justify-content: space-between; }
    .th .bar { height: 10px; background: #000; border-radius: 5px; overflow: hidden; margin-top: 5px; }
    .th .bar i { display: block; height: 100%; background: linear-gradient(90deg, #f4c430, #ff8a3d); }
    .th .s { font-size: 12px; color: #aab6e0; margin-top: 4px; }
    .bd { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .bd div { background: #17244f; border-radius: 8px; padding: 10px; text-align: center; font-size: 12px; line-height: 1.4; color: #aab6e0; }
    .bd div.got { background: #3a2f0a; outline: 2px solid var(--gold); color: #fff; }
    .bd .e { font-size: 26px; display: block; margin-bottom: 4px; filter: grayscale(1); opacity: .5; }
    .bd .got .e { filter: none; opacity: 1; }
    .bd b { display: block; color: var(--gold2); font-size: 12px; }
    .st { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .st div { background: #17244f; border-radius: 8px; padding: 10px; font-size: 12px; color: #aab6e0; }
    .st b { display: block; font-family: var(--px); font-size: 13px; color: #fff; margin-top: 6px; }
    .vol { display: flex; align-items: center; gap: 12px; padding: 10px 0 14px; border-bottom: 1px solid #2a3c78; }
    .vol input { flex: 1; accent-color: var(--gold); height: 28px; }
    .vol span { font-family: var(--px); font-size: 9px; width: 44px; text-align: right; }
    .opt-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #2a3c78; font-size: 15px; }
    #saveCode { width: 100%; height: 80px; margin-top: 8px; font-size: 11px; border-radius: 6px; border: 2px solid #000; padding: 6px; }
    .muted { font-size: 12px; color: #8f9cc8; line-height: 1.5; }
    a.lnk { color: var(--gold2); }

    /* Lecteur de fiches */
    #fiche { padding: 10px; align-items: center; }
    #fiche .win { width: 100%; max-width: 540px; flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--paper); color: #1a1a1a;
      border: 4px solid #1a1a1a; box-shadow: inset 0 0 0 3px #c8b88a; }
    #fHead { padding: 12px 14px 8px; border-bottom: 3px solid #1a1a1a; background: #efe3c2; border-radius: 4px 4px 0 0; }
    #fWhere { font-family: var(--px); font-size: 9px; line-height: 1.6; color: #6a5a2a; }
    #fCount { font-family: var(--px); font-size: 8px; color: #6a5a2a; margin-top: 4px; display: flex; justify-content: space-between; }
    #fBody { flex: 1; overflow-y: auto; padding: 14px; -webkit-overflow-scrolling: touch; user-select: text; -webkit-user-select: text; }
    #fSec { font-size: 12px; color: #6a5a2a; margin-bottom: 6px; }
    #fTitle { font-size: 19px; font-weight: 800; line-height: 1.3; margin-bottom: 12px; color: #1d2c5e; }
    #fTitle .tb { display: inline-block; font-family: var(--px); font-size: 9px; background: #1d2c5e; color: #fff; padding: 4px 6px; border-radius: 4px; margin-right: 6px; vertical-align: middle; }
    #fContent { font-size: 15.5px; line-height: 1.55; }
    #fContent p { margin: 0 0 8px; }
    #fContent ul, #fContent ol { margin: 4px 0 10px 20px; }
    #fContent li { margin-bottom: 4px; }
    #fContent .highlight { background: #ffe680; padding: 0 3px; border-radius: 3px; font-weight: 600; }
    #fContent table { border-collapse: collapse; width: 100%; font-size: 13px; margin: 8px 0; display: block; overflow-x: auto; }
    #fContent th, #fContent td { border: 1px solid #c8b88a; padding: 5px 6px; text-align: left; vertical-align: top; }
    #fContent th { background: #efe3c2; }
    #fContent blockquote { border-left: 4px solid #3a56b0; padding: 4px 10px; margin: 8px 0; background: #eef3ff; }
    #fSrc { margin-top: 14px; padding: 10px; border-radius: 8px; background: #efe3c2; font-size: 12.5px; line-height: 1.5; color: #4a3f20; }
    #fSrc strong { display: block; margin-bottom: 4px; }
    #fNav { display: flex; gap: 8px; padding: 10px; border-top: 3px solid #1a1a1a; flex-wrap: wrap; }
    #fNav .btn { flex: 1; padding: 12px 6px; }
    #fNew { color: #b33; }
    #confetti { position: fixed; inset: 0; z-index: 70; pointer-events: none; }
    @media (max-height: 640px) { #dpad { transform: scale(.82); } .rb { width: 54px; height: 54px; } #pad { padding: 4px 16px 8px; } }
  </style>
  <!-- Web app (PWA) : installation sur l'écran d'accueil + mode hors ligne -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f1a3a">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Objectif BC">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
    }
  </script>
</head>
<body>
<div id="app">
  <div id="hud">
    <canvas id="hudAvatar" width="18" height="22"></canvas>
    <div id="hudMid">
      <div id="hudRank">Recrue</div>
      <div class="xpbar"><i id="hudXpFill" style="width:0"></i><span id="hudXpTxt">0 XP</span></div>
      <div id="hudHearts"></div>
    </div>
    <button class="hbtn" id="btnHome" aria-label="Retour au site">🏠</button>
    <button class="hbtn" id="btnMusic" aria-label="Musique">🎵</button>
    <button class="hbtn" id="btnMenu" aria-label="Menu">☰</button>
  </div>

  <div id="stage">
    <canvas id="world"></canvas>
    <div id="toast"></div>
    <div id="mini"><canvas id="mcv" width="160" height="240"></canvas><button id="mQuit" aria-label="Pause">⏸</button></div>
  </div>

  <div id="pad">
    <div id="dpad">
      <button class="u" data-d="up" aria-label="Haut">▲</button>
      <button class="l" data-d="left" aria-label="Gauche">◀</button>
      <div class="c"></div>
      <button class="r" data-d="right" aria-label="Droite">▶</button>
      <button class="d" data-d="down" aria-label="Bas">▼</button>
    </div>
    <div id="abtns">
      <button class="rb small" id="btnB" aria-label="Menu">B</button>
      <button class="rb" id="btnA" aria-label="Parler">A</button>
    </div>
  </div>
</div>

<!-- Dialogue -->
<div class="ov" id="dlg">
  <div class="box">
    <div id="dlgWho"></div>
    <div id="dlgTxt"></div>
    <div id="dlgBtns"></div>
  </div>
</div>

<!-- Combat -->
<div class="ov" id="battle">
  <div id="bTop">
    <div class="plate"><b id="eName">Dossier</b><div class="hp"><i id="eHp" style="width:100%"></i></div>
      <div class="muted" id="eSub" style="color:#555;margin-top:5px"></div></div>
    <canvas id="eSprite" width="32" height="32" style="width:112px;height:112px"></canvas>
  </div>
  <div id="bMid">
    <canvas id="pSprite" width="18" height="22" style="width:90px;height:110px"></canvas>
    <div class="plate" id="pPlate"><b id="pName">Toi</b><div id="bHearts"></div><div id="bCombo"></div></div>
  </div>
  <div id="qbox">
    <div id="qMeta"></div>
    <div id="qTxt"></div>
    <div id="qOpts"></div>
    <div id="qExp"></div>
    <button class="btn blue" id="qNext">SUIVANT ▶</button>
  </div>
  <div style="display:flex;justify-content:center;gap:10px;padding:0 0 18px"><button class="btn alt" id="bMusic" aria-label="Musique">🎵</button><button class="btn alt" id="bFlee">S'ENFUIR</button></div>
</div>

<!-- Résultat -->
<div class="ov" id="res"><div class="win">
  <div class="pxt" id="resTitle"></div>
  <div id="resBody"></div>
  <button class="btn" id="resOk">CONTINUER</button>
</div></div>

<!-- Promotion -->
<div class="ov" id="evo"><div class="win">
  <div class="pxt" style="font-size:13px;color:var(--gold2)">PROMOTION !</div>
  <canvas id="evoCanvas" width="18" height="22"></canvas>
  <div id="evoTxt"></div>
  <button class="btn" id="evoOk" style="visibility:hidden">GÉNIAL !</button>
</div></div>

<!-- Menu -->
<div class="ov" id="menu"><div class="win">
  <div id="mTabs">
    <button data-t="car" class="on">CARRIÈRE</button>
    <button data-t="mai">MAÎTRISE</button>
    <button data-t="bad">BADGES</button>
    <button data-t="opt">OPTIONS</button>
  </div>
  <div id="mBody"></div>
  <button class="btn" id="mClose">RETOUR AU JEU</button>
</div></div>

<!-- Lecteur de fiches -->
<div class="ov" id="fiche"><div class="win">
  <div id="fHead"><div id="fWhere"></div><div id="fCount"><span id="fPos"></span><span id="fNew"></span></div></div>
  <div id="fBody">
    <div id="fSec"></div>
    <div id="fTitle"></div>
    <div id="fContent"></div>
    <div id="fSrc"></div>
  </div>
  <div id="fNav">
    <button class="btn alt" id="fPrev">◀</button>

const P = { x: START.x, y: START.y, px: START.x * 16, py: START.y * 16, dir: 'up', frame: 0, moving: false, t0: 0, fx: 0, fy: 0 };

const STEP_MS = 150;
let held = null, busy = false;

function frameLoop(t) {
  // déplacement
  if (P.moving) {
    const k = Math.min(1, (t - P.t0) / STEP_MS);
    P.px = (P.fx + (P.x - P.fx) * k) * 16; P.py = (P.fy + (P.y - P.fy) * k) * 16;
    if (k >= 1) { P.moving = false; arrive(); }
  }
  if (!P.moving && held && !busy) tryMove(held, t);

  lg.imageSmoothingEnabled = false;
  const vw = low.width, vh = low.height;
  let cx = Math.round(P.px + 8 - vw / 2), cy = Math.round(P.py + 8 - vh / 2);
  cx = mapBuf.width <= vw ? Math.round((mapBuf.width - vw) / 2) : Math.max(0, Math.min(cx, mapBuf.width - vw));
  cy = mapBuf.height <= vh ? Math.round((mapBuf.height - vh) / 2) : Math.max(0, Math.min(cy, mapBuf.height - vh));
  lg.fillStyle = '#0b1026'; lg.fillRect(0, 0, vw, vh);
  lg.drawImage(mapBuf, -cx, -cy);
  drawSparkles(cx, cy, t);
  drawCabs(cx, cy, t);

  const ents = NPCS.map(n => ({ y: n.y * 16, draw: () => {

    drawChar(lg, n.x * 16 - cx, n.y * 16 - cy, 'down', 0, look, t);
    bubble(n, n.x * 16 - cx + 8, n.y * 16 - cy - 6, t);

  ents.sort((a, b) => a.y - b.y).forEach(e => e.draw());

/* =========================================================
   FICHES DE RÉVISION DANS LES MEUBLES
   Les fiches sont lues directement depuis fiches.html : toute mise à jour

const FURN_NAME = { S: 'Étagère', C: 'Ordinateur', T: 'Bureau', d: 'Table d\'examen', K: 'Voiture de patrouille' };
function roomAt(x, y) {
  if (x >= 33) return null;
  const band = x >= 25 ? 3 : x >= 17 ? 2 : x >= 9 ? 1 : 0;
  if (y >= 1 && y <= 5) return [1, 2, 3, 8][band];
  if (y >= 11 && y <= 15) return [4, 5, 6, 7][band];
  return null;
}
let FICHES = null, fichesErr = false;
const PIECES = [];   // meubles interactifs : { x, y, c, room, list: [index fiche] }
MAP.forEach((row, y) => row.forEach((c, x) => {
  const room = roomAt(x, y);
  if (room === null) return;
  if (FURN_NAME[c] || c === 'B') PIECES.push({ x, y, c, room, list: [] });
}));
function pieceName(p) { return p.c === 'B' ? (floorAt(p.x, p.y) === '~' ? 'Sac de frappe' : 'Canapé') : FURN_NAME[p.c]; }
async function loadFiches() {
  try {
    let res = await fetch('fiches').catch(() => null);
    if (!res || !res.ok) res = await fetch('fiches.html');
    const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
    doc.querySelectorAll('script, style').forEach(n => n.remove());
    doc.querySelectorAll('*').forEach(n => [...n.attributes].forEach(a => { if (/^on/i.test(a.name)) n.removeAttribute(a.name); }));
    const list = []; let sec = '';
    doc.querySelectorAll('h2, .fiche').forEach(el => {
      if (el.tagName === 'H2') { sec = el.textContent.trim(); return; }
      const m = el.className.match(/type-([A-I])/); if (!m) return;
      const h3 = el.querySelector('h3'); if (h3) h3.querySelectorAll('.type-badge').forEach(b => b.remove());
      const title = h3 ? h3.textContent.trim() : 'Fiche';
      const c = el.querySelector('.contenu'), src = el.querySelector('.source-box');
      list.push({ t: m[1], title, sec, html: c ? c.innerHTML : '', src: src ? src.innerHTML : '', id: hash(m[1] + '|' + title) });
    });
    if (!list.length) throw new Error('aucune fiche');
    FICHES = list;
    // répartition des fiches de la salle entre ses meubles, dans l'ordre du site
    const byRoom = {};
    PIECES.forEach(p => (byRoom[p.room] = byRoom[p.room] || []).push(p));
    Object.entries(byRoom).forEach(([room, ps]) => {
      const th = ROOMS[room].themes;
      const idx = FICHES.map((f, i) => [f, i]).filter(([f]) => th === 'ALL' || th.includes(f.t)).map(([, i]) => i);
      const per = Math.ceil(idx.length / ps.length);
      ps.forEach((p, k) => { p.list = idx.slice(k * per, (k + 1) * per); });
    });
  } catch (e) { fichesErr = true; }
}
loadFiches();

function evolve(r0, p0) {

function confetti() {

  const ps = Array.from({ length: 90 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .4, vy: 2 + Math.random() * 3, vx: -1 + Math.random() * 2, s: 4 + Math.random() * 5, c: cols[Math.random() * 5 | 0] }));
  const t0 = performance.now();
  (function f(t) {
    g.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; g.fillStyle = p.c; g.fillRect(p.x, p.y, p.s, p.s); });
    if (t - t0 < 2600) requestAnimationFrame(f); else g.clearRect(0, 0, c.width, c.height);
  })(t0);
}

const mcv = document.getElementById('mcv'), mg = mcv.getContext('2d');
const BTN = { A: false, B: false };
let MINI = null;
function padHit(d) { if (MINI && MINI.dirPress && !MINI.paused) MINI.dirPress(d); }
function bdown(k) { BTN[k] = true; if (MINI && MINI.press && !MINI.paused) MINI.press(k); }
function bup(k) { BTN[k] = false; }
function startGame(id) {
  const gm = { snake: mkSnake, pac: mkPac, car: mkCar, mario: mkMario }[id]();
  gm.id = id; gm.r0 = rankIdx(); gm.p0 = prestige(); gm.f = 0; gm.st = 'ready';
  MINI = gm; busy = true; held = null; releaseAll(); BTN.A = BTN.B = false;
  show('mini'); playSong('arcade'); mg.imageSmoothingEnabled = false;
  let last = performance.now(), acc = 0;
  (function loop(now) {
    if (MINI !== gm) return;
    acc += Math.min(100, now - last); last = now;
    if (gm.paused) acc = 0;
    else while (acc >= 16.667) { gm.f++; gm.update(); acc -= 16.667; if (MINI !== gm) return; }
    gm.draw(now);
    requestAnimationFrame(loop);
  })(last);
}
function pauseGame() {

const PAC_MAP = ['#############', '#o....#....o#', '#.##.###.##.#', '#...........#', '#.##.#.#.##.#', '#....#.#....#', '####.#-#.####', '#....GGG....#', '####.###.####',

function mkPac() {
  const CS = 11, OX = 8, OY = 30, opp = { up: 'down', down: 'up', left: 'right', right: 'left' };

    ghosts.forEach((o, i) => Object.assign(o, { x: o.x0 * CS, y: 7 * CS, dir: 'up', mode: 'house', out: false, fr: false, wait: GH[i].rel * 0.6 }));

      } else if (ch === '=') { R(G, '#c0562a', x, y, T, T); R(G, '#7a3318', x, y + 7, T, 1); R(G, '#7a3318', x + 7, y, 1, 7); R(G, '#7a3318', x + 3, y + 8, 1, 8); R(G, '#7a3318', x + 12, y + 8, 1, 8); R(G, '#e08550', x, y, T, 1); }
      else if (ch === '?') { R(G, '#000', x, y, T, T); R(G, Math.floor(t / 250) % 2 ? '#f4c430' : '#e0a010', x + 1, y + 1, T - 2, T - 2); R(G, '#fff2a8', x + 1, y + 1, T - 2, 1); txt(G, '?', x + 6, y + 5, '#7a3318'); }
      else if (ch === '!') { R(G, '#000', x, y, T, T); R(G, '#8a7a5a', x + 1, y + 1, T - 2, T - 2); }
      else if (ch === 'T') { const top = L[r - 1][c] !== 'T'; R(G, '#1b9a46', x, y, T, T); R(G, '#5fe08a', x + 2, y, 3, T); R(G, '#0e6a2c', x + T - 3, y, 3, T); if (top) { R(G, '#12803a', x - 1, y, T + 2, 5); R(G, '#5fe08a', x, y + 1, 4, 3); } }
    }
    coins.forEach(c => { if (!c.got) { const w = Math.abs(Math.sin(t / 220 + c.x)) * 6 + 2; R(G, '#a07010', c.x - cam + 4 - w / 2, c.y, w, 10); R(G, '#f4c430', c.x - cam + 4 - w / 2 + 1, c.y + 1, Math.max(1, w - 2), 8); } });
    g.items.forEach(m => { const x = m.x - cam, y = m.y; R(G, '#e63946', x, y, 12, 8); R(G, '#fff', x + 2, y + 1, 3, 3); R(G, '#fff', x + 7, y + 2, 3, 3); R(G, '#f2e2c4', x + 2, y + 8, 8, 4); R(G, '#111', x + 4, y + 9, 1, 2); R(G, '#111', x + 7, y + 9, 1, 2); });
    walk.forEach(e => {
      if (e.dead < 0) return; const x = Math.round(e.x - cam), y = Math.round(e.y);
      if (e.dead > 0) { R(G, '#222', x, y + 10, 12, 4); R(G, '#a33', x + 3, y + 10, 6, 2); return; }
      const f = Math.floor(t / 160) % 2;
      R(G, '#2a2a33', x + 1, y, 10, 5); R(G, '#c9a07a', x + 3, y + 3, 6, 4); R(G, '#e63946', x + 4, y + 4, 1, 2); R(G, '#e63946', x + 7, y + 4, 1, 2);
      R(G, '#2a2a33', x, y + 6, 12, 5); R(G, '#fff', x + 3, y + 7, 1, 2); R(G, '#111', x + 1 + f, y + 11, 4, 3); R(G, '#111', x + 7 - f, y + 11, 4, 3); R(G, '#8a5a2e', x + 9, y + 7, 4, 3);
    });
    drones.forEach(d => { if (!d.on || d.off) return; const x = Math.round(d.x - cam), y = d.y; R(G, '#333', x + 2, y - 2, 8, 2); R(G, '#555', x, y, 12, 4); R(G, '#e63946', x + 5, y + 1, 2, 2); if (Math.floor(t / 60) % 2) R(G, '#bbb', x - 2, y - 3, 16, 1); else R(G, '#bbb', x + 1, y - 3, 10, 1); });
    // joueur
    if (g.dying || g.inv <= 0 || Math.floor(t / 70) % 2) {
      if (g.flash > 0 && Math.floor(t / 60) % 2) R(G, 'rgba(255,230,120,.35)', 0, 0, AW, AH);
      sprite(G, g.px - cam + g.w / 2, g.py + g.h, t);
    }
    // HUD
    panel(G, 0, 16, 'rgba(0,0,0,.45)');
    for (let i = 0; i < g.lives; i++) heart(G, 6 + i * 8, 4);
    txt(G, 'x' + g.coins, 36, 5, '#f4c430'); R(G, '#f4c430', 30, 4, 4, 6);
    txt(G, 'SCORE ' + g.score, AW - 6 - tw('SCORE ' + g.score), 5, '#fff');
    R(G, '#000', 6, 12, 148, 2); R(G, '#3cc76a', 6, 12, Math.round(148 * Math.min(1, g.maxX / (DOORC * T))), 2);
    if (g.sup) txt(G, 'SUPER', 6, 20, '#f4c430');
    if (g.banner > 0) { panel(G, 56, 18); ctr(G, g.bannerTxt, 62, '#f4c430'); }
    if (g.st === 'ready') readyScreen(G, 'SUPER BRIGADIER-CHEF', 'RENTRE AU COMMISSARIAT', '#5fa8ff', 'A = SAUTER · B = BAISSER');
    if (g.st === 'won') { panel(G, 100, 26); ctr(G, 'MISSION ACCOMPLIE !', 110, '#3cc76a'); }
    if (g.st === 'dead') { panel(G, 100, 26); ctr(G, 'TU T\'ES FAIT ATTRAPER...', 110, '#e63946'); }
  };
  g.result = () => {
    const win = g.st === 'won', prog = Math.min(1, g.maxX / (DOORC * T));
    return { score: g.score, win, xp: win ? 30 : Math.floor(prog * 12),
      lines: win ? ['🏢 Tu as rejoint le commissariat sans te faire attraper !', `❤️ ${g.lives} vie${g.lives > 1 ? 's' : ''} restante${g.lives > 1 ? 's' : ''} · 🥾 ${g.kills} voyou${g.kills > 1 ? 's' : ''} écrasé${g.kills > 1 ? 's' : ''}${g.sup ? ' · 🍄 Super !' : ''}`, `Score : <b>${g.score}</b>`]
        : [`🚓 Attrapé à ${Math.round(prog * 100)} % du chemin`, `Score : <b>${g.score}</b>`] };
  };
  g.title = r => r.win ? 'MISSION ACCOMPLIE !' : 'ATTRAPÉ…';
  return g;
}

/* ---------- Décor de la salle : enseigne néon + verrous ---------- */
function drawCabs(cx, cy, t) {
  const sx = 33 * 16 - cx, sy = 3 * 16 - cy;
  if (sx > -160 && sx < low.width + 16) {
    const cols = ['#ff4fd8', '#2ee6d6', '#f4c430', '#ff4fd8', '#2ee6d6', '#f4c430'];
    R(lg, '#0a0820', sx + 30, sy + 3, 84, 11); R(lg, '#ff4fd8', sx + 29, sy + 2, 86, 1); R(lg, '#2ee6d6', sx + 29, sy + 14, 86, 1);
    'ARCADE'.split('').forEach((ch, i) => { const on = Math.floor(t / 400 + i) % 6 !== 0; txt(lg, ch, sx + 40 + i * 12, sy + 5, on ? cols[i] : '#5a4a7a', 2); });
  }
  const a = arc();
  GAMES.forEach((G, i) => {
    const x = (34 + i * 2) * 16 - cx, y = 4 * 16 - cy;
    if (x < -16 || x > low.width) return;
    if (gameLocked(G)) { R(lg, '#000', x + 4, y + 5, 8, 7); R(lg, '#9aa0b5', x + 5, y + 6, 6, 5); R(lg, '#000', x + 6, y + 3, 4, 3); R(lg, '#9aa0b5', x + 7, y + 4, 2, 2); R(lg, '#222', x + 7, y + 8, 2, 2); R(lg, 'rgba(0,0,0,.45)', x + 2, y + 2, 12, 9); R(lg, '#000', x + 4, y + 5, 8, 7); R(lg, '#9aa0b5', x + 5, y + 6, 6, 5); R(lg, '#222', x + 7, y + 8, 2, 2); }
    else if (!a.plays[G.id] && Math.floor(t / 400) % 2) { R(lg, '#f4c430', x + 7, y - 4, 2, 5); R(lg, '#f4c430', x + 5, y - 2, 6, 1); R(lg, '#fff', x + 7, y - 2, 2, 1); }
  });
}

window.__G = { get S() { return S; }, get B() { return B; }, get FICHES() { return FICHES; }, PIECES, get audio() { return { AC, musBus, sfxBus }; }, P, QS, ROOMS }; // utile pour le débogage
resize(); updHud(); updMusicBtn(); requestAnimationFrame(frameLoop);
window.__ARC = { startGame, get MINI() { return MINI; }, GAMES, arc };
window.__MUS = MUS; window.__AUD = { rebuildAudio, wakeAudio, get AC() { return AC; } };
if (!QS.length) toast('Impossible de charger les questions (data.js).', 6000);
else if (!S.intro) {
  setTimeout(() => dialog('Agent Zaïdou, accueil',
    `Bienvenue au commissariat, recrue ! 👋<br><br>Chaque salle cache un thème de l'examen. Va parler à la personne au fond de chaque salle pour traiter son dossier : chaque bonne réponse te rapporte de l'XP.<br><br>Monte en grade jusqu'à devenir <b>Brigadier-Chef</b> ! 🎖️<br>📚 Les meubles qui scintillent cachent les fiches de révision.<br><small>Déplace-toi avec la croix, parle avec A.</small>`,
    [['C\'EST PARTI !', () => { S.intro = true; save(); }]]), 400);
}
})();
