<script>
let quizQ = [], quizIdx = 0, quizScore = 0, quizAnswered = false;
let quizErrors = [];
let quizLog = [];      // toutes les questions traitées, pour « Revoir les questions »
let lastScoreHtml = '';
let quizRecorded = false;   // historique des lacunes déjà enregistré pour ce quiz
let customPool = null;      // entraînement ciblé : liste de questions imposée
let focusSet = null;        // entraînement ciblé : questions à poser en priorité
let enableTimer = false;
let timerInterval = null;
let timerSeconds = 0;
// Minuteur (compte à rebours)
let enableCountdown = false;
let countdownMinutes = 30;
let countdownEnd = 0;
let timeUp = false;
let unansweredCount = 0;
// Pause
let quizPool = [];
let isPaused = false;
let pauseCount = 0;
let pausedLeftMs = 0;
let pausedAnswered = false;
let isUnlimited = false; // ===== NOUVELLE VAR =====

// ===== EXAMEN BLANC BC 2026 =====
// Programme de l'écrit : temps de travail (A à E) et TSI (F et I), moitié-moitié
const EXAM = { total: 80, minutes: 120, groups: [['A','B','C','D','E'], ['F','I']] };
let examMode = false;
let savedCountdownMinutes = null;
let examAnswers = [];      // réponse choisie pour chaque question (null = pas de réponse)
let examFinalized = false;

// ===== THÈMES =====
const THEMES = [
  { group: '⏱ Temps de travail', items: [
    ['A', 'Régimes de travail'],
    ['B', 'Services supplémentaires'],
    ['C', 'Congés'],
    ['D', 'Astreinte'],
    ['E', 'RPS']
  ]},
  { group: '📋 Autres thèmes', items: [
    ['F', 'TSI'],
    ['G', 'Déontologie'],
    ['H', 'Management'],
    ['I', 'Pratiques Pro. Intervention']
  ]}
];
// Tous cochés au départ, le choix est gardé quand on recommence
let selectedThemes = THEMES.flatMap(g => g.items.map(([t]) => t));

// ===== FONCTION POUR MÉLANGER LES RÉPONSES ET RECALCULER L'INDEX =====
function shuffleAndUpdateAnswer(options, correctAnswerIndex) {
  const shuffled = [...options];
  const correctAnswer = options[correctAnswerIndex];
  
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  
  const newIndex = shuffled.indexOf(correctAnswer);
  return { options: shuffled, correctIndex: newIndex };
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function formatTime(seconds) {
  const hours = Math.floor(seconds / 3600);
  const minutes = Math.floor((seconds % 3600) / 60);
  const secs = seconds % 60;
  
  if(hours > 0) {
    return `${hours}h ${minutes}m ${secs}s`;
  } else if(minutes > 0) {
    return `${minutes}m ${secs}s`;
  } else {
    return `${secs}s`;
  }
}

function startTimer(reset = true) {
  if(reset) timerSeconds = 0;
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimerDisplay();
  }, 1000);
}

function stopTimer() {
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = null;
}

// Basé sur l'heure de fin : reste juste même si l'onglet passe en arrière-plan
function countdownLeft() {
  return Math.max(0, Math.ceil((countdownEnd - Date.now()) / 1000));
}

function startCountdown(ms = countdownMinutes * 60 * 1000) {
  countdownEnd = Date.now() + ms;
  timerInterval = setInterval(() => {
    updateCountdownDisplay();
    if(countdownLeft() === 0) onTimeUp();
  }, 250);
}

function countdownClass(left) {
  return left <= 60 ? 'danger' : left <= 300 ? 'warning' : '';
}

function updateCountdownDisplay() {
  const el = document.getElementById('timerDisplay');
  if(!el) return;
  const left = countdownLeft();
  el.textContent = '⏳ ' + formatTime(left);
  el.className = 'timer-display ' + countdownClass(left);
}

// Temps écoulé : toutes les questions non répondues passent en échec
function onTimeUp() {
  stopTimer();
  timeUp = true;
  if(examMode) { finalizeExam(); showScore(); return; }
  const firstUnanswered = quizAnswered ? quizIdx + 1 : quizIdx;
  if(isUnlimited) {
    // Mode illimité : pas de liste fixe, on arrête simplement le quiz
    unansweredCount = 0;
    quizIdx = firstUnanswered;
  } else {
    const rest = quizQ.slice(firstUnanswered);
    unansweredCount = rest.length;
    rest.forEach(q => {
      const item = {
        question: q.q,
        userAnswer: '⏰ Pas de réponse (temps écoulé)',
        correctAnswer: q.o[q.a],
        explanation: q.e,
        source: q.s,
        t: q.t
      };
      quizErrors.push(item);
      quizLog.push({ ...item, ok: false });
    });
    quizIdx = quizQ.length;
  }
  showScore();
}

function updateTimerDisplay() {
  const timerEl = document.getElementById('timerDisplay');
  if(timerEl) {
    timerEl.textContent = '⏱️ ' + formatTime(timerSeconds);
  }
}

function startQuiz(numQuestions = 20, withTimer = false, unlimited = false, withCountdown = false) {
  enableTimer = withTimer;
  enableCountdown = withCountdown;
  timeUp = false;
  unansweredCount = 0;
  isUnlimited = unlimited;
  
  const pool = customPool || Q.filter(q => selectedThemes.includes(q.t));
  customPool = null;
  quizPool = pool;
  quizRecorded = false;
  isPaused = false;
  pauseCount = 0;
  if(examMode) {
    // Les mises en situation (QX) ne servent qu'à l'examen blanc : toutes incluses, complétées par la banque Q
    const QXL = typeof QX !== 'undefined' ? QX : [];
    quizPool = Q.concat(QXL).filter(q => EXAM.groups.flat().includes(q.t));
    const perGroup = EXAM.total / EXAM.groups.length;
    quizQ = shuffle(EXAM.groups.flatMap(g => {
      const cas = shuffle(QXL.filter(q => g.includes(q.t))).slice(0, perGroup);
      return cas.concat(shuffle(Q.filter(q => g.includes(q.t))).slice(0, perGroup - cas.length));
    }));
    examAnswers = new Array(quizQ.length).fill(null);
    examFinalized = false;
  } else if(unlimited) {
    quizQ = shuffle(pool); // Toutes les questions des thèmes choisis en mode illimité
  } else {
    const maxQuestions = Math.min(numQuestions, pool.length);
    // Entraînement ciblé : les questions déjà ratées passent en premier
    const prio = focusSet ? shuffle(pool.filter(q => focusSet.has(q.q))) : [];
    const autres = shuffle(pool.filter(q => !prio.includes(q)));
    quizQ = shuffle(prio.concat(autres).slice(0, maxQuestions));
    focusSet = null;
  }
  
  // ===== MÉLANGE LES RÉPONSES DE TOUTES LES QUESTIONS =====
  quizQ.forEach((question, index) => {
    const shuffled = shuffleAndUpdateAnswer(question.o, question.a);
    quizQ[index].o = shuffled.options;
    quizQ[index].a = shuffled.correctIndex;
  });
  
  quizIdx = 0;
  quizScore = 0;
  quizErrors = [];
  quizLog = [];
  quizAnswered = false;
  
  stopTimer();
  if(enableCountdown) {
    startCountdown();
  } else if(enableTimer) {
    startTimer();
  }
  
  showQuizQ();
}

function showQuizQ(){
  if(quizIdx >= quizQ.length){ 
    stopTimer();
    showScore(); 
    return; 
  }
  
  quizAnswered = false;
  const q = quizQ[quizIdx];
  const pct = Math.round((quizIdx/quizQ.length)*100);
  
  let timerHTML = '';
  if(enableCountdown) {
    const left = countdownLeft();
    timerHTML = `<div class="timer-display ${countdownClass(left)}" id="timerDisplay">⏳ ${formatTime(left)}</div>`;
  } else if(enableTimer) {
    timerHTML = `<div class="timer-display" id="timerDisplay">⏱️ ${formatTime(timerSeconds)}</div>`;
  }
  
  let stopBtnHTML = '';
  if(isUnlimited) {
    stopBtnHTML = `<button class="stop-btn" onclick="stopUnlimitedQuiz()">⏹️ Arrêter le Quiz</button>`;
  }
  
  let html = `
  <div class="quiz-top">
    ${timerHTML}
    <div style="font-size:13px;color:#666">Question ${quizIdx+1}${isUnlimited ? '' : ' / ' + quizQ.length} - Thème ${q.t}</div>
    <div class="progress-bar"><div class="progress-fill" style="width:${isUnlimited ? '0%' : pct+'%'}"></div></div>
    ${examMode ? '<div style="font-size:13px;color:#003366">🎓 Examen blanc : correction à la fin</div>' : `<div style="font-size:13px;color:#003366">Score : ${quizScore} / ${quizIdx}</div>`}
    ${(enableCountdown || enableTimer) && !examMode ? '<button class="pause-btn" id="pauseBtn" onclick="pauseQuiz()">⏸️ Pause</button>' : ''}
    ${stopBtnHTML}
  </div>
  <div id="pausePanel"></div>
  <div class="qcard">
    <h3>${q.q}</h3>`;
  
  if(examMode) {
    q.o.forEach((opt,j) => {
      html += `<button class="opt" onclick="examSelect(${j})">${String.fromCharCode(65+j)}. ${opt}</button>`;
    });
    html += `<button class="btn green" id="qnextbtn" style="display:none;margin-top:12px" onclick="nextQuizQ()">${quizIdx + 1 < quizQ.length ? 'Question suivante ➡️' : 'Terminer l\'examen ✅'}</button>
  </div>`;
    document.getElementById('quizarea').innerHTML = html;
    return;
  }

  q.o.forEach((opt,j) => {
    html += `<button class="opt" onclick="answerQuiz(this,${j})">${String.fromCharCode(65+j)}. ${opt}</button>`;
  });
  
  html += `<div class="expl" id="qexpl">💡 ${q.e}${q.s ? `<span class="src">📌 Source : ${q.s}</span>` : ''}</div>
    <button class="btn green" id="qnextbtn" style="display:none;margin-top:12px" onclick="nextQuizQ()">Question suivante ➡️</button>
  </div>`;
  
  document.getElementById('quizarea').innerHTML = html;
}

// ===== PAUSE =====
// Pour éviter la triche, une question pas encore répondue est remplacée par une
// nouvelle question, ou reportée à la fin s'il n'en reste pas d'autre.
function replaceCurrentQuestion() {
  const used = new Set(quizQ);
  const fresh = quizPool.filter(q => !used.has(q));
  if(!isUnlimited && fresh.length > 0) {
    const pick = fresh[Math.floor(Math.random() * fresh.length)];
    const shuffled = shuffleAndUpdateAnswer(pick.o, pick.a);
    pick.o = shuffled.options;
    pick.a = shuffled.correctIndex;
    quizQ[quizIdx] = pick;
    return 'Elle sera remplacée par une nouvelle question.';
  }
  const [q] = quizQ.splice(quizIdx, 1);
  const shuffled = shuffleAndUpdateAnswer(q.o, q.a);
  q.o = shuffled.options;
  q.a = shuffled.correctIndex;
  quizQ.push(q);
  return 'Elle est reportée à la fin du quiz.';
}

function pauseQuiz() {
  // La pause ne sert qu'à arrêter le temps : seulement avec chronomètre ou minuteur
  if(isPaused || !(enableCountdown || enableTimer)) return;
  isPaused = true;
  pauseCount++;
  if(enableCountdown) pausedLeftMs = Math.max(0, countdownEnd - Date.now());
  stopTimer();

  pausedAnswered = quizAnswered;
  const info = pausedAnswered
    ? 'Ta réponse à cette question est gardée.'
    : 'La question en cours est passée. ' + replaceCurrentQuestion();

  document.querySelector('.qcard').classList.add('paused');
  document.getElementById('pauseBtn').disabled = true;
  const stopBtn = document.querySelector('.stop-btn');
  if(stopBtn) stopBtn.disabled = true;
  document.getElementById('pausePanel').innerHTML = `
    <div class="pause-panel">
      <h3>⏸️ Quiz en pause</h3>
      <p>${info}${enableCountdown || enableTimer ? '<br>Le temps est arrêté.' : ''}</p>
      <button class="btn green" onclick="resumeQuiz()">▶️ Reprendre</button>
    </div>`;
}

function resumeQuiz() {
  if(!isPaused) return;
  isPaused = false;
  if(enableCountdown) startCountdown(pausedLeftMs);
  else if(enableTimer) startTimer(false);

  if(pausedAnswered) {
    // Question déjà répondue : on retrouve l'explication telle quelle
    document.querySelector('.qcard').classList.remove('paused');
    document.getElementById('pausePanel').innerHTML = '';
    document.getElementById('pauseBtn').disabled = false;
    const stopBtn = document.querySelector('.stop-btn');
    if(stopBtn) stopBtn.disabled = false;
  } else {
    showQuizQ();
  }
}

function answerQuiz(btn, chosen){
  if(quizAnswered || isPaused) return;
  quizAnswered = true;
  const q = quizQ[quizIdx];
  const card = btn.closest('.qcard');
  
  card.querySelectorAll('.opt').forEach((b,j) => {
    b.disabled = true;
    if(j === q.a) b.classList.add('correct');
    else if(j === chosen) b.classList.add('wrong');
  });

  if(chosen !== q.a) {
    quizErrors.push({
      question: q.q,
      userAnswer: q.o[chosen],
      correctAnswer: q.o[q.a],
      explanation: q.e,
      source: q.s,
      t: q.t
    });
  }
  
  quizLog.push({
    question: q.q,
    userAnswer: q.o[chosen],
    correctAnswer: q.o[q.a],
    explanation: q.e,
    source: q.s,
    t: q.t,
    ok: chosen === q.a
  });

  if(chosen === q.a) quizScore++;
  document.getElementById('qexpl').style.display = 'block';
  document.getElementById('qnextbtn').style.display = 'block';
}

// Examen blanc : la réponse est enregistrée sans correction (modifiable avant de passer à la suite)
function examSelect(chosen) {
  if(isPaused) return;
  examAnswers[quizIdx] = chosen;
  quizAnswered = true;
  document.querySelectorAll('.qcard .opt').forEach((b, j) => b.classList.toggle('chosen', j === chosen));
  document.getElementById('qnextbtn').style.display = 'block';
}

// Examen blanc : correction de toutes les réponses à la fin
function finalizeExam() {
  if(examFinalized) return;
  examFinalized = true;
  quizScore = 0;
  quizErrors = [];
  quizLog = [];
  unansweredCount = 0;
  quizQ.forEach((q, i) => {
    const chosen = examAnswers[i];
    const item = {
      question: q.q,
      userAnswer: chosen === null ? '⏰ Pas de réponse' : q.o[chosen],
      correctAnswer: q.o[q.a],
      explanation: q.e,
      source: q.s,
      t: q.t
    };
    quizLog.push({ ...item, ok: chosen === q.a });
    if(chosen === q.a) { quizScore++; return; }
    if(chosen === null) unansweredCount++;
    quizErrors.push(item);
  });
  quizIdx = quizQ.length;
}

function nextQuizQ(){
  quizIdx++;
  showQuizQ();
}

// ===== NOUVELLE FONCTION : ARRÊTER LE QUIZ ILLIMITÉ =====
function stopUnlimitedQuiz() {
  stopTimer();
  showScore();
}

function showScore(){
  stopTimer();
  if(examMode) finalizeExam();
  const pct = quizIdx > 0 ? Math.round((quizScore/quizIdx)*100) : 0;
  const mention = pct>=80 ? '🏆 Excellent !' : pct>=60 ? '👍 Bien' : '📚 À revoir';
  
  let timerInfo = '';
  if(enableCountdown) {
    if(timeUp) {
      timerInfo = `<div class="timeout-info">⏰ <strong>Temps écoulé</strong> (minuteur de ${countdownMinutes} min)`
        + (unansweredCount > 0 ? `<br>${unansweredCount} question${unansweredCount > 1 ? 's' : ''} non traitée${unansweredCount > 1 ? 's' : ''} comptée${unansweredCount > 1 ? 's' : ''} en échec` : '')
        + `</div>`;
    } else {
      const used = countdownMinutes * 60 - countdownLeft();
      timerInfo = `<p style="margin:10px 0;opacity:0.9">⏳ Terminé en <strong>${formatTime(used)}</strong> sur ${countdownMinutes} min</p>`;
    }
  } else if(enableTimer) {
    timerInfo = `<p style="margin:10px 0;opacity:0.9">⏱️ Temps utilisé : <strong>${formatTime(timerSeconds)}</strong></p>`;
  }

  if(pauseCount > 0) {
    timerInfo += `<p style="margin:5px 0;opacity:0.8">⏸️ ${pauseCount} pause${pauseCount > 1 ? 's' : ''}</p>`;
  }

  let modeInfo = '';
  if(examMode) {
    const note = quizQ.length ? Math.round(quizScore / quizQ.length * 200) / 10 : 0;
    modeInfo = `<div class="exam-note">🎓 Examen blanc BC 2026<br><span>${String(note).replace('.', ',')} / 20</span></div>`;
  } else if(isUnlimited) {
    modeInfo = `<p style="margin:5px 0;opacity:0.8;font-style:italic">Mode : 🔄 Quiz Illimité</p>`;
  }
  
  let html = `
  <div class="score-box">
    <div class="big">${pct}%</div>
    <h2>${mention}</h2>
    <p style="margin:10px 0;opacity:0.9">${quizScore} bonnes réponses sur ${quizIdx}</p>
    ${timerInfo}
    ${modeInfo}
    <div class="stats-grid">
      <div class="stat-card"><div class="sn">${quizScore}</div><div class="sl">✅ Correctes</div></div>
      <div class="stat-card"><div class="sn">${quizIdx-quizScore}</div><div class="sl">❌ Erreurs</div></div>
      <div class="stat-card"><div class="sn">${pct}%</div><div class="sl">📊 Score</div></div>
    </div>`;

  html += lacunesHtml();

  if(quizErrors.length > 0) {
    html += `<button class="btn" style="margin-top:20px;background:#d32f2f;color:white" onclick="showErrorReview()">🔍 Voir mes erreurs (${quizErrors.length})</button>`;
  }

  if(quizLog.length > 0) {
    html += `<button class="btn" style="margin-top:10px;background:#1565c0;color:white;border:2px solid white" onclick="showAllReview()">📋 Revoir les questions (${quizLog.length})</button>`;
  }

  html += `<button class="btn" style="margin-top:10px;background:white;color:#003366" onclick="showQuizSelector()">🔄 Recommencer</button>
  </div>`;

  lastScoreHtml = html;
  document.getElementById('quizarea').innerHTML = html;
  window.scrollTo(0, 0);
}

// ===== BILAN DES LACUNES =====
function lacunesHtml() {
  if(!quizRecorded && quizLog.length > 0) { lacRecord(quizLog); quizRecorded = true; }
  const stats = lacThemeStats(quizLog);
  if(stats.length === 0) return '';
  const faibles = stats.filter(lacEstFaible);
  const recurrentes = lacRecurrentes(lacLoad());

  let h = `<div class="lacunes">`;
  if(faibles.length > 0) {
    const noms = faibles.map(v => LAC_THEMES[v.t]);
    h += `<h3>🎯 Tu as des lacunes en ${lacListe(noms)}</h3>
      <p>Entraîne-toi en priorité sur ${faibles.length > 1 ? 'ces parties' : 'cette partie'}. Relis aussi les explications de tes erreurs pour comprendre pourquoi la réponse était fausse.</p>`;
  } else {
    h += `<h3>👏 Pas de lacune marquée sur ce quiz</h3><p>Continue à varier les thèmes pour consolider.</p>`;
  }
  h += `<div class="lac-table">` + stats.map(v => {
    const faible = lacEstFaible(v);
    const coul = v.pct >= 80 ? '#2e7d32' : v.pct >= 60 ? '#ef6c00' : '#c62828';
    return `<div class="lac-ligne${faible ? ' faible' : ''}">
      <div class="lac-nom">${v.t} - ${LAC_THEMES[v.t]}</div>
      <div class="lac-barre"><span style="width:${v.pct}%;background:${coul}"></span></div>
      <div class="lac-pct">${v.ok}/${v.n} · ${v.pct} %</div>
      ${faible ? `<div class="lac-actions">
        <button onclick="trainTheme('${v.t}')">🎯 S'entraîner</button>
        <a href="fiches.html#${LAC_FICHE[v.t]}">📚 Revoir la fiche</a>
      </div>` : ''}
    </div>`;
  }).join('') + `</div>`;

  if(recurrentes.length > 0) {
    h += `<div class="lac-recurrent">🔁 <strong>${recurrentes.length} question${recurrentes.length > 1 ? 's' : ''}</strong> ratée${recurrentes.length > 1 ? 's' : ''} plusieurs fois au fil de tes quiz.
      <a href="points-a-travailler.html">📄 Mes points à travailler (PDF)</a></div>`;
  }
  return h + `</div>`;
}

// Quiz de 20 questions sur un thème, en commençant par les questions déjà ratées
function trainTheme(t) {
  leaveExamMode();
  selectedThemes = [t];
  const d = lacLoad();
  focusSet = new Set(Object.keys(d.q).filter(k => d.q[k].ko > 0 && d.q[k].t === t));
  startQuiz(20, false, false, false);
  window.scrollTo(0, 0);
}

// Quiz sur les questions ratées plusieurs fois (quiz.html?revision=1)
function trainRecurrentes() {
  const rec = new Set(lacRecurrentes(lacLoad()).map(x => x.q));
  const tout = Q.concat(typeof QX !== 'undefined' ? QX : []);
  const pool = tout.filter(q => rec.has(q.q));
  if(pool.length === 0) { showQuizSelector(); return; }
  customPool = pool;
  startQuiz(pool.length, false, false, false);
}

// Retour à l'écran de résultat sans le recalculer
function backToScore() {
  document.getElementById('quizarea').innerHTML = lastScoreHtml;
  window.scrollTo(0, 0);
}

// Toutes les questions traitées, bonnes et mauvaises réponses
function showAllReview() {
  const nbOk = quizLog.filter(x => x.ok).length;
  let html = `
  <div class="error-review" style="border-left-color:#1565c0">
    <h3 style="color:#1565c0">📋 Revoir les questions (${quizLog.length})</h3>
    <p style="margin-bottom:15px">✅ ${nbOk} bonne${nbOk > 1 ? 's' : ''} réponse${nbOk > 1 ? 's' : ''} · ❌ ${quizLog.length - nbOk} erreur${quizLog.length - nbOk > 1 ? 's' : ''}</p>
    <button class="btn" style="background:white;color:#1565c0;border:2px solid #1565c0;margin-bottom:20px" onclick="backToScore()">⬅️ Retour au résultat</button>
    <div id="allList"></div>
    <button class="btn" style="background:white;color:#1565c0;border:2px solid #1565c0;margin-top:10px" onclick="backToScore()">⬅️ Retour au résultat</button>
  </div>`;
  document.getElementById('quizarea').innerHTML = html;
  window.scrollTo(0, 0);
  document.getElementById('allList').innerHTML = quizLog.map((x, i) => `
    <div class="error-card" style="border-left:4px solid ${x.ok ? '#2e7d32' : '#d32f2f'}">
      <div class="question">${x.ok ? '✅' : '❌'} Question ${i+1} : ${x.question}</div>
      ${x.ok
        ? `<div class="correct">Ta réponse : <strong>${x.userAnswer}</strong></div>`
        : `<div class="answer">Ta réponse : <strong>${x.userAnswer}</strong></div>
           <div class="correct">Bonne réponse : <strong>${x.correctAnswer}</strong></div>`}
      <div style="margin-top:10px;color:#555;font-size:14px">💡 Explication : ${x.explanation}</div>
      ${x.source ? `<div style="margin-top:6px;color:#777;font-size:12px;font-style:italic">📌 Source : ${x.source}</div>` : ''}
    </div>`).join('');
}

function showErrorReview() {
  let html = `
  <div class="error-review">
    <h3>🔍 Révision de tes erreurs (${quizErrors.length})</h3>
    <p style="margin-bottom:15px">Voici les questions où tu as fait des erreurs. Relis bien les explications pour progresser !</p>
    <button class="btn" style="background:white;color:#d32f2f;border:2px solid #d32f2f;margin-bottom:20px" onclick="backToScore()">⬅️ Retour au résultat</button>
    <button class="btn" style="background:white;color:#555;border:2px solid #999;margin-bottom:20px" onclick="showQuizSelector()">🏠 Retour au menu</button>
    <div id="errorList"></div>
    <button class="btn" style="background:white;color:#d32f2f;border:2px solid #d32f2f;margin-top:10px" onclick="backToScore()">⬅️ Retour au résultat</button>
  </div>`;

  document.getElementById('quizarea').innerHTML = html;
  window.scrollTo(0, 0);

  const errorList = document.getElementById('errorList');
  quizErrors.forEach((error, index) => {
    errorList.innerHTML += `
    <div class="error-card">
      <div class="question">Question ${index+1} : ${error.question}</div>
      ${error.t ? `<div class="theme-tag">${error.t} - ${LAC_THEMES[error.t] || ''}</div>` : ''}
      <div class="answer">Ta réponse : <strong>${error.userAnswer}</strong></div>
      <div class="correct">Bonne réponse : <strong>${error.correctAnswer}</strong></div>
      <div style="margin-top:10px;color:#555;font-size:14px">💡 Pourquoi : ${error.explanation}</div>
      ${error.source ? `<div style="margin-top:6px;color:#777;font-size:12px;font-style:italic">📌 Source : ${error.source}</div>` : ''}
    </div>`;
  });
}

function leaveExamMode() {
  if(!examMode) return;
  examMode = false;
  enableCountdown = false;
  if(savedCountdownMinutes !== null) countdownMinutes = savedCountdownMinutes;
  savedCountdownMinutes = null;
}

function showExamIntro() {
  leaveExamMode();
  document.getElementById('quizarea').innerHTML = `
  <div class="quiz-selector exam-intro">
    <h3>🎓 Examen blanc BC 2026</h3>
    <p>Conditions de l'écrit du <strong>30 novembre</strong> : QCM noté sur 20.</p>
    <ul>
      <li><strong>${EXAM.total} questions</strong> tirées au hasard : ${EXAM.total / 2} en <strong>temps de travail</strong> (A à E) et ${EXAM.total / 2} en <strong>TSI</strong> (F et I)</li>
      <li>Minuteur de <strong>${EXAM.minutes / 60} heures</strong> ; à zéro, les questions non traitées sont comptées fausses</li>
      <li>Pas de pause, comme le jour de l'examen</li>
      <li><strong>Aucune correction pendant l'épreuve</strong> : tu peux changer ta réponse tant que tu n'es pas passé à la question suivante</li>
      <li>Note sur 20 à la fin, puis correction de tes erreurs avec la source</li>
    </ul>
    <button onclick="startExam()">▶️ Commencer l'examen blanc</button>
    <p style="margin-top:12px"><a class="exam-back" onclick="showQuizSelector()">⬅️ Revenir au quiz libre</a></p>
  </div>`;
}

function startExam() {
  savedCountdownMinutes = countdownMinutes;
  examMode = true;
  countdownMinutes = EXAM.minutes;
  startQuiz(EXAM.total, false, false, true);
}

function showQuizSelector() {
  leaveExamMode();
  document.getElementById('quizarea').innerHTML = `
  <div class="quiz-selector">
    <h3>🏆 Mode Quiz Complet</h3>
    <p>Choisis le nombre de questions :</p>
    <select id="numQuestions">
      <option value="20">20 questions</option>
      <option value="30">30 questions</option>
      <option value="40">40 questions</option>
      <option value="50">50 questions</option>
      <option value="unlimited">🔄 Mode Illimité</option>
    </select>

    <p style="margin-top:15px">Choisis les thèmes :</p>
    <div class="theme-picker">
      ${THEMES.map(g => `
        <div class="theme-group">${g.group}</div>
        <div class="theme-list">
          ${g.items.map(([t, label]) => `
            <label class="theme-item">
              <input type="checkbox" class="theme-cb" value="${t}" ${selectedThemes.includes(t) ? 'checked' : ''} onchange="updateThemes()">
              <span>${t} - ${label} <span class="nb">(${Q.filter(q => q.t === t).length})</span></span>
            </label>`).join('')}
        </div>`).join('')}
      <div class="theme-actions">
        <a onclick="setAllThemes(true)">Tout cocher</a>
        <a onclick="setAllThemes(false)">Tout décocher</a>
      </div>
      <div class="theme-warning" id="themeWarning">Coche au moins un thème pour commencer.</div>
    </div>
    
    <div class="quiz-options">
      <div class="checkbox-wrapper" id="timerOption">
        <input type="checkbox" id="enableTimerCheckbox" onchange="toggleTimer()">
        <label for="enableTimerCheckbox">⏱️ Activer le chronomètre</label>
      </div>
    </div>
    <div class="quiz-options">
      <div class="checkbox-wrapper" id="countdownOption">
        <input type="checkbox" id="enableCountdownCheckbox" ${enableCountdown ? 'checked' : ''} onchange="toggleCountdown()">
        <label for="enableCountdownCheckbox">⏳ Activer le minuteur</label>
        <input type="number" id="countdownMinutes" class="countdown-minutes" min="1" max="300" step="1" value="${countdownMinutes}" ${enableCountdown ? '' : 'disabled'}>
        <span>min</span>
      </div>
    </div>
    
    <button id="startQuizBtn" onclick="handleQuizStart()">▶️ Commencer le Quiz</button>

    ${lacLoad().sessions > 0 ? `<div class="lac-menu"><a href="points-a-travailler.html">📄 Mes points à travailler</a>${lacRecurrentes(lacLoad()).length > 0 ? ` · <a onclick="trainRecurrentes()">🔁 Refaire mes questions ratées (${lacRecurrentes(lacLoad()).length})</a>` : ''}</div>` : ''}

    <div class="exam-zone">
      <p><strong>Ou en conditions réelles :</strong> ${EXAM.total} questions temps de travail + TSI, ${EXAM.minutes / 60} h, note sur 20</p>
      <button class="exam-btn" onclick="showExamIntro()">🎓 Examen blanc BC 2026</button>
    </div>
  </div>`;
  updateThemes();
  toggleTimer();
}

function updateThemes() {
  selectedThemes = [...document.querySelectorAll('.theme-cb:checked')].map(cb => cb.value);
  const none = selectedThemes.length === 0;
  document.getElementById('startQuizBtn').disabled = none;
  document.getElementById('themeWarning').style.display = none ? 'block' : 'none';
}

// Chronomètre et minuteur : un seul à la fois, l'autre case est grisée
function toggleTimer() {
  const timerOn = document.getElementById('enableTimerCheckbox').checked;
  const countdownOn = document.getElementById('enableCountdownCheckbox').checked;
  document.getElementById('enableCountdownCheckbox').disabled = timerOn;
  document.getElementById('enableTimerCheckbox').disabled = countdownOn;
  document.getElementById('countdownMinutes').disabled = !countdownOn;
  document.getElementById('timerOption').classList.toggle('option-off', countdownOn);
  document.getElementById('countdownOption').classList.toggle('option-off', timerOn);
}

function toggleCountdown() {
  toggleTimer();
}

function setAllThemes(checked) {
  document.querySelectorAll('.theme-cb').forEach(cb => { cb.checked = checked; });
  updateThemes();
}

// ===== NOUVELLE FONCTION POUR GÉRER LE DÉMARRAGE =====
function handleQuizStart() {
  const selected = document.getElementById('numQuestions').value;
  const withTimer = document.getElementById('enableTimerCheckbox').checked;
  if(selectedThemes.length === 0) return;
  const withCountdown = document.getElementById('enableCountdownCheckbox').checked;
  if(withCountdown) {
    const m = parseInt(document.getElementById('countdownMinutes').value, 10);
    countdownMinutes = Math.min(300, Math.max(1, isNaN(m) ? 30 : m));
  }
  
  if(selected === 'unlimited') {
    startQuiz(0, withTimer, true, withCountdown);
  } else {
    startQuiz(parseInt(selected), withTimer, false, withCountdown);
  }
}

// Affiche le menu au chargement (quiz.html?examen=1 ouvre directement l'examen blanc)
const urlParams = new URLSearchParams(location.search);
if(urlParams.has('examen')) showExamIntro();
else if(urlParams.has('revision')) trainRecurrentes();
else if(urlParams.get('theme') && LAC_THEMES[urlParams.get('theme')]) trainTheme(urlParams.get('theme'));
else showQuizSelector();
</script>
