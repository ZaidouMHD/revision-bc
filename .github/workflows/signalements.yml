name: Signalements des questions

# Chaque jour, recopie dans signalements/ les signalements envoyés depuis le site
# (réponses du formulaire Google, publiées en CSV).
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recopier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger les réponses du formulaire
        env:
          CSV_URL: ${{ vars.SIGNALEMENTS_CSV_URL }}
        run: |
          if [ -z "$CSV_URL" ]; then
            echo "Variable SIGNALEMENTS_CSV_URL non définie : rien à faire."
            exit 0
          fi
          curl -fsSL "$CSV_URL" -o signalements/signalements.csv
          python3 .github/scripts/signalements.py signalements/signalements.csv signalements/README.md

      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "ZaidouMHD"
          git config user.email "ZaidouMHD@users.noreply.github.com"
          git add signalements/
          if git diff --cached --quiet; then
            echo "Aucun nouveau signalement."
          else
            git commit -m "Signalements du $(date +%d/%m/%Y)"
            git push
          fi
