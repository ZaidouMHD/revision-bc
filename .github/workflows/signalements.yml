name: Signalements des questions

# Recopie dans signalements/ les signalements envoyés depuis le site.
# Le relais garde les messages 12 heures : on passe toutes les 3 heures.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recopier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer les signalements
        run: python3 .github/scripts/signalements.py revision-bc-signal-7ff63c90d526845c signalements

      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "ZaidouMHD"
          git config user.email "ZaidouMHD@users.noreply.github.com"
          git add signalements/
          if git diff --cached --quiet; then
            echo "Aucun nouveau signalement."
          else
            git commit -m "Signalements du $(date +%d/%m/%Y)"
            git push
          fi
