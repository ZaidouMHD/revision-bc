<html lang="fr">

  <meta charset="UTF-8">

  <link rel="stylesheet" href="style.css">
  <style>
    /* ===== DROPDOWN TEMPS DE TRAVAIL ===== */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .dropdown-wrapper {
      position: relative;
      display: inline-block;
    }

    .dropdown-main-btn {
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 20px;
      border: 2px solid #1a3a6b;
      background: white;
      color: #1a3a6b;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dropdown-main-btn:hover,
    .dropdown-main-btn.af {
      background: #1a3a6b;
      color: white;
    }

    .dropdown-main-btn .arrow {
      font-size: 0.7rem;
      transition: transform 0.2s;
    }

    .dropdown-main-btn.open .arrow {
      transform: rotate(180deg);
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      background: white;
      border: 2px solid #1a3a6b;
      border-radius: 12px;
      overflow: hidden;
      z-index: 999;
      min-width: 180px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    .dropdown-menu.open {
      display: block;
    }

    .dropdown-menu button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 10px 16px;
      border: none;
      background: white;
      color: #1a3a6b;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      border-bottom: 1px solid #e8edf5;
    }

    .dropdown-menu button:last-child {
      border-bottom: none;
    }

    .dropdown-menu button:hover {
      background: #e8edf5;
    }

    .dropdown-menu button.af {
      background: #1a3a6b;
      color: white;
      font-weight: 700;
    }

    /* ===== BILAN DES LACUNES (QCM immédiat) ===== */
    body { padding-bottom: 70px; }
    .qcm-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 900; background: #002060; color: #fff; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: center; padding: 8px 12px; box-shadow: 0 -2px 10px rgba(0,0,0,.2); font-size: 14px; }
    .qcm-bar button { font: inherit; font-size: 14px; border: 0; border-radius: 6px; padding: 7px 12px; cursor: pointer; background: #ffd400; color: #002060; font-weight: 700; }
    .qcm-bar button[disabled] { opacity: .5; cursor: default; }
    .bilan-fond { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,.5); overflow-y: auto; padding: 20px 12px; }
    .bilan-fond.open { display: block; }
    .bilan { max-width: 760px; margin: 0 auto; background: #fff; border-radius: 10px; padding: 16px; position: relative; }
    .bilan .fermer { position: absolute; top: 10px; right: 10px; border: 0; background: #eee; border-radius: 50%; width: 32px; height: 32px; font-size: 16px; cursor: pointer; }
    .bilan h2 { color: #003366; font-size: 20px; margin: 0 40px 4px 0; }
    .bilan .chiffres { color: #555; margin-bottom: 12px; }
    .bilan h3 { font-size: 17px; margin: 0 0 6px; }
    .bilan .msg { background: #fff4d6; border-left: 4px solid #e0a100; padding: 8px 10px; border-radius: 4px; margin-bottom: 12px; font-size: 14px; }
    .lac-ligne { display: grid; grid-template-columns: minmax(130px, 1.4fr) 2fr auto; gap: 6px 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid #eee; font-size: 14px; }
    .lac-ligne.faible .lac-nom { color: #c62828; font-weight: 700; }
    .lac-barre { height: 10px; background: #eceff4; border-radius: 5px; overflow: hidden; }
    .lac-barre span { display: block; height: 100%; }
    .lac-pct { white-space: nowrap; font-weight: 600; }
    .lac-actions { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
    .lac-actions button, .lac-actions a { font-size: 13px; padding: 5px 10px; border-radius: 5px; border: 1px solid #c62828; background: #fff; color: #c62828; cursor: pointer; text-decoration: none; }
    .lac-actions button { background: #c62828; color: #fff; }
    .lac-recurrent { margin-top: 12px; background: #fff4d6; color: #5d4300; border-radius: 6px; padding: 8px 10px; font-size: 14px; }
    .lac-recurrent a { display: inline-block; margin-top: 6px; background: #00238a; color: #fff; padding: 5px 10px; border-radius: 5px; text-decoration: none; }
    .bilan .erreur { border-left: 4px solid #d32f2f; background: #fafafa; border-radius: 5px; padding: 9px 11px; margin-bottom: 8px; font-size: 14px; }
    .bilan .erreur .q { font-weight: 700; margin-bottom: 3px; }
    .bilan .erreur .tag { display: inline-block; font-size: 12px; background: #e8edfb; color: #00238a; border-radius: 10px; padding: 1px 8px; margin-bottom: 4px; }
    .bilan .erreur .faux { color: #d32f2f; }
    .bilan .erreur .bon { color: #388e3c; }
    .bilan .erreur .pq { color: #555; margin-top: 4px; }
    .bilan .erreur .src { color: #777; font-size: 12px; font-style: italic; margin-top: 3px; }
    .bilan .bas { display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; margin-top: 14px; }
    .bilan .bas button, .bilan .bas a { font: inherit; font-size: 14px; border: 2px solid #003366; color: #003366; background: #fff; border-radius: 6px; padding: 7px 12px; cursor: pointer; text-decoration: none; }
    .qcard.deja-rate { border-left-color: #d32f2f; }
    .qcard .deja { display: inline-block; margin-left: 6px; font-size: 11px; color: #d32f2f; font-weight: 700; }
    @media (max-width: 600px) {
      .lac-ligne { grid-template-columns: 1fr auto; }
      .lac-barre { grid-column: 1 / -1; grid-row: 2; }
    }
  </style>

<script>

// ===== CONFIG DES FILTRES =====
const tempsDeTravailSubs = ['A','B','C','D','E'];
const tempsDeTravailLabels = {
  'A':'A – Régimes',
  'B':'B – Supp.',
  'C':'C – Congés',
  'D':'D – Astreinte',
  'E':'E – RPS'
};
const autresFilters = ['F','G','H','I'];
const autresLabels = {
  'F':'F – TSI',
  'G':'G – Déontologie',
  'H':'H – Management',
  'I':'I – Pratiques Pro. Intervention'
};

let currentFilter = 'all';
let dropdownOpen = false;

// ===== MÉLANGER LES RÉPONSES AU CHARGEMENT =====
function shuffleQuestionsOnLoad() {
  Q.forEach((question, index) => {
    const shuffled = shuffleAndUpdateAnswer(question.o, question.a);
    Q[index].o = shuffled.options;
    Q[index].a = shuffled.correctIndex;
  });
}
shuffleQuestionsOnLoad();

// ===== CONSTRUCTION DE LA BARRE DE FILTRES =====
function buildFilterBar() {
  const bar = document.getElementById('filterbar');

  // Bouton "Tous"
  const btnTous = document.createElement('button');
  btnTous.id = 'fball';
  btnTous.className = 'af';
  btnTous.textContent = 'Tous';
  btnTous.onclick = () => filterQCM('all');
  bar.appendChild(btnTous);

  // ---- Dropdown "Temps de travail" ----
  const wrapper = document.createElement('div');
  wrapper.className = 'dropdown-wrapper';

  const mainBtn = document.createElement('button');
  mainBtn.className = 'dropdown-main-btn';
  mainBtn.id = 'dropdownMainBtn';
  mainBtn.innerHTML = '⏱ Temps de travail <span class="arrow">▼</span>';
  mainBtn.onclick = (e) => {
    e.stopPropagation();
    toggleDropdown();
  };

  const menu = document.createElement('div');
  menu.className = 'dropdown-menu';
  menu.id = 'dropdownMenu';

  tempsDeTravailSubs.forEach(f => {
    const btn = document.createElement('button');
    btn.id = 'fb' + f;
    btn.textContent = tempsDeTravailLabels[f];
    btn.onclick = (e) => {
      e.stopPropagation();
      filterQCM(f);
      closeDropdown();
    };
    menu.appendChild(btn);
  });

  wrapper.appendChild(mainBtn);
  wrapper.appendChild(menu);
  bar.appendChild(wrapper);

  // ---- Autres filtres (F, G, H) ----
  autresFilters.forEach(f => {
    const btn = document.createElement('button');
    btn.id = 'fb' + f;
    btn.textContent = autresLabels[f];
    btn.onclick = () => filterQCM(f);
    // Style inline pour matcher vos boutons existants
    btn.style.cssText = `
      cursor:pointer; padding:8px 16px; border-radius:20px;
      border:2px solid #1a3a6b; background:white; color:#1a3a6b;
      font-weight:600; font-size:0.9rem; transition:all 0.2s;
    `;
    btn.onmouseover = () => { if(!btn.classList.contains('af')) { btn.style.background='#e8edf5'; } };
    btn.onmouseout = () => { if(!btn.classList.contains('af')) { btn.style.background='white'; } };
    bar.appendChild(btn);
  });
}

// ===== GESTION DU DROPDOWN =====
function toggleDropdown() {
  dropdownOpen = !dropdownOpen;
  document.getElementById('dropdownMenu').classList.toggle('open', dropdownOpen);
  document.getElementById('dropdownMainBtn').classList.toggle('open', dropdownOpen);
}

function closeDropdown() {
  dropdownOpen = false;
  document.getElementById('dropdownMenu').classList.remove('open');
  document.getElementById('dropdownMainBtn').classList.remove('open');
}

// Ferme le dropdown si clic ailleurs
document.addEventListener('click', () => closeDropdown());

// ===== FILTRE ACTIF =====
function filterQCM(f) {
  currentFilter = f;

  // Reset tous les boutons
  document.getElementById('fball').classList.remove('af');
  document.getElementById('fball').style.background = '';
  document.getElementById('fball').style.color = '';

  tempsDeTravailSubs.forEach(s => {
    const b = document.getElementById('fb' + s);
    if(b) b.classList.remove('af');
  });

  autresFilters.forEach(s => {
    const b = document.getElementById('fb' + s);
    if(b) {
      b.classList.remove('af');
      b.style.background = 'white';
      b.style.color = '#1a3a6b';
    }
  });

  // Bouton "Temps de travail" parent actif si sous-catégorie sélectionnée
  const mainBtn = document.getElementById('dropdownMainBtn');
  if(tempsDeTravailSubs.includes(f)) {
    mainBtn.classList.add('af');
    document.getElementById('fb' + f).classList.add('af');
  } else {
    mainBtn.classList.remove('af');
  }

  if(f === 'all') {
    const btnTous = document.getElementById('fball');
    btnTous.classList.add('af');
  } else if(autresFilters.includes(f)) {
    const b = document.getElementById('fb' + f);
    b.classList.add('af');
    b.style.background = '#1a3a6b';
    b.style.color = 'white';
  }

  renderQCM(f);
}

// ===== RENDU DES QUESTIONS =====
function renderQCM(f, ratesDabord = false) {
  let list = f === 'all' ? Q : Q.filter(q => q.t === f);
  const hist = lacLoad().q;
  if(ratesDabord) {
    // Entraînement : les questions déjà ratées en premier
    const rates = list.filter(q => hist[q.q] && hist[q.q].ko > 0);
    list = rates.concat(list.filter(q => !rates.includes(q)));
  }
  let html = '';
  list.forEach((q, i) => {
    const gi = Q.indexOf(q);
    const h = hist[q.q];
    const rate = h && h.ko > 0;
    html += `<div class="qcard${rate ? ' deja-rate' : ''}">
      <div class="num">Question ${i+1}/${list.length} - Thème ${q.t}${rate ? `<span class="deja">déjà ratée ${h.ko} fois</span>` : ''}</div>
      <h3>${q.q}</h3>`;
    q.o.forEach((opt, j) => {
      html += `<button class="opt" onclick="answerQ(this,${gi},${j})">${String.fromCharCode(65+j)}. ${opt}</button>`;
    });
    html += `<div class="expl" id="expl${gi}">💡 ${q.e}${q.s ? `<span class="src">📌 Source : ${q.s}</span>` : ''}${lienSignal({ question: q.q, reponse: q.o[q.a], theme: q.t })}</div></div>`;
  });
  document.getElementById('qcmlist').innerHTML = html;
}

// ===== RÉPONSE =====
function answerQ(btn, gi, chosen) {
  const q = Q[gi];
  const card = btn.closest('.qcard');
  if(card.querySelector('.opt.correct') || card.querySelector('.opt.wrong')) return;
  card.querySelectorAll('.opt').forEach((b, j) => {
    b.disabled = true;
    if(j === q.a) b.classList.add('correct');
    else if(j === chosen) b.classList.add('wrong');
  });
  document.getElementById('expl' + gi).style.display = 'block';

  // Bilan : la réponse rejoint la séance et l'historique des lacunes
  const item = { question: q.q, userAnswer: q.o[chosen], correctAnswer: q.o[q.a], explanation: q.e, source: q.s, t: q.t, ok: chosen === q.a };
  seance.push(item);
  lacRecord([item], seance.length === 1);
  majBarre();
}

// ===== BILAN DES LACUNES =====
let seance = [];   // réponses données depuis l'ouverture de la page

function majBarre() {
  const ok = seance.filter(x => x.ok).length;
  const ko = seance.length - ok;
  const pct = Math.round(ok / seance.length * 100);
  const faibles = lacThemeStats(seance).filter(lacEstFaible);
  document.getElementById('barScore').innerHTML = `${seance.length} réponse${seance.length > 1 ? 's' : ''} · ✅ ${ok} · ❌ ${ko} · ${pct} %`
    + (faibles.length ? ` · <strong style="color:#ffd400">🎯 lacunes : ${faibles.map(v => LAC_THEMES[v.t]).join(', ')}</strong>` : '');
  document.getElementById('barBtn').disabled = false;
}

function openBilan() {
  if(!seance.length) return;
  const ok = seance.filter(x => x.ok).length;
  const stats = lacThemeStats(seance);
  const faibles = stats.filter(lacEstFaible);
  const recurrentes = lacRecurrentes(lacLoad());
  const erreurs = seance.filter(x => !x.ok);

  let h = `<button class="fermer" onclick="closeBilan()" aria-label="Fermer">✕</button>
    <h2>📊 Mon bilan</h2>
    <div class="chiffres">${seance.length} réponse${seance.length > 1 ? 's' : ''} depuis l'ouverture de la page · ✅ ${ok} · ❌ ${erreurs.length} · ${Math.round(ok / seance.length * 100)} % de réussite</div>`;

  if(faibles.length) {
    h += `<div class="msg"><h3 style="color:#c62828">🎯 Tu as des lacunes en ${lacListe(faibles.map(v => LAC_THEMES[v.t]))}</h3>
      Entraîne-toi en priorité sur ${faibles.length > 1 ? 'ces parties' : 'cette partie'}, et relis plus bas pourquoi tes réponses étaient fausses.</div>`;
  } else {
    h += `<div class="msg"><h3 style="color:#2e7d32">👏 Pas de lacune marquée pour l'instant</h3>Il faut au moins 3 réponses sur un thème pour juger.</div>`;
  }

  h += stats.map(v => {
    const faible = lacEstFaible(v);
    const coul = v.pct >= 80 ? '#2e7d32' : v.pct >= 60 ? '#ef6c00' : '#c62828';
    return `<div class="lac-ligne${faible ? ' faible' : ''}">
      <div class="lac-nom">${v.t} - ${LAC_THEMES[v.t]}</div>
      <div class="lac-barre"><span style="width:${v.pct}%;background:${coul}"></span></div>
      <div class="lac-pct">${v.ok}/${v.n} · ${v.pct} %</div>
      ${faible ? `<div class="lac-actions">
        <button onclick="entrainer('${v.t}')">🎯 S'entraîner sur ce thème</button>
        <a href="fiches.html#${LAC_FICHE[v.t]}">📚 Revoir la fiche</a>
      </div>` : ''}
    </div>`;
  }).join('');

  if(recurrentes.length) {
    h += `<div class="lac-recurrent">🔁 <strong>${recurrentes.length} question${recurrentes.length > 1 ? 's' : ''}</strong> ratée${recurrentes.length > 1 ? 's' : ''} plusieurs fois au fil de tes révisions.
      <a href="points-a-travailler.html">📄 Mes points à travailler (PDF)</a></div>`;
  }

  if(erreurs.length) {
    h += `<h3 style="color:#d32f2f;margin-top:16px">❌ Pourquoi tu t'es trompé (${erreurs.length})</h3>`;
    h += erreurs.map(x => `<div class="erreur">
      <div class="tag">${x.t} - ${LAC_THEMES[x.t]}</div>
      <div class="q">${x.question}</div>
      <div class="faux">Ta réponse : <strong>${x.userAnswer}</strong></div>
      <div class="bon">Bonne réponse : <strong>${x.correctAnswer}</strong></div>
      <div class="pq">💡 Pourquoi : ${x.explanation}</div>
      ${x.source ? `<div class="src">📌 Source : ${x.source}</div>` : ''}
      ${lienSignal({ question: x.question, reponse: x.correctAnswer, theme: x.t })}
    </div>`).join('');
  }

  h += `<div class="bas">
    <button onclick="closeBilan()">⬅️ Continuer le QCM</button>
    <button onclick="openRevue(false)" style="background:#1565c0;color:#fff;border-color:#1565c0">📋 Revoir les questions (${seance.length})</button>
    <a href="points-a-travailler.html">📄 Mes points à travailler</a>
  </div>`;
  document.getElementById('bilan').innerHTML = h;
  document.getElementById('bilanFond').classList.add('open');
  document.getElementById('bilanFond').scrollTop = 0;
}

// Toutes les réponses de la séance (ou seulement les erreurs)
function openRevue(seulementErreurs) {
  const liste = seulementErreurs ? seance.filter(x => !x.ok) : seance;
  const nbOk = seance.filter(x => x.ok).length;
  const nbKo = seance.length - nbOk;
  const boutons = `<div class="bas" style="justify-content:flex-start">
    <button onclick="openBilan()">⬅️ Retour au bilan</button>
    ${seulementErreurs
      ? `<button onclick="openRevue(false)" style="background:#1565c0;color:#fff;border-color:#1565c0">📋 Revoir les questions (${seance.length})</button>`
      : (nbKo ? `<button onclick="openRevue(true)" style="background:#d32f2f;color:#fff;border-color:#d32f2f">🔍 Voir seulement mes erreurs (${nbKo})</button>` : '')}
    <button onclick="closeBilan()">✏️ Continuer le QCM</button>
  </div>`;
  let h = `<button class="fermer" onclick="closeBilan()" aria-label="Fermer">✕</button>
    <h2>${seulementErreurs ? `🔍 Mes erreurs (${nbKo})` : `📋 Revoir les questions (${seance.length})`}</h2>
    <div class="chiffres">✅ ${nbOk} bonne${nbOk > 1 ? 's' : ''} réponse${nbOk > 1 ? 's' : ''} · ❌ ${nbKo} erreur${nbKo > 1 ? 's' : ''}</div>
    ${boutons}<div style="height:10px"></div>`;
  h += liste.map((x, i) => `<div class="erreur" style="border-left-color:${x.ok ? '#2e7d32' : '#d32f2f'}">
      <div class="tag">${x.t} - ${LAC_THEMES[x.t]}</div>
      <div class="q">${x.ok ? '✅' : '❌'} Question ${i + 1} : ${x.question}</div>
      ${x.ok
        ? `<div class="bon">Ta réponse : <strong>${x.userAnswer}</strong></div>`
        : `<div class="faux">Ta réponse : <strong>${x.userAnswer}</strong></div>
           <div class="bon">Bonne réponse : <strong>${x.correctAnswer}</strong></div>`}
      <div class="pq">💡 ${x.ok ? 'Explication' : 'Pourquoi'} : ${x.explanation}</div>
      ${x.source ? `<div class="src">📌 Source : ${x.source}</div>` : ''}
      ${lienSignal({ question: x.question, reponse: x.correctAnswer, theme: x.t })}
    </div>`).join('');
  h += boutons;
  document.getElementById('bilan').innerHTML = h;
  document.getElementById('bilanFond').classList.add('open');
  document.getElementById('bilanFond').scrollTop = 0;
}

function closeBilan() {
  document.getElementById('bilanFond').classList.remove('open');
}

// Affiche le thème, questions déjà ratées en premier
function entrainer(t) {
  closeBilan();
  filterQCM(t);
  renderQCM(t, true);
  window.scrollTo(0, 0);
}

buildFilterBar();
const themeUrl = new URLSearchParams(location.search).get('theme');
if(themeUrl && LAC_THEMES[themeUrl]) entrainer(themeUrl);
else renderQCM('all');
</script>
