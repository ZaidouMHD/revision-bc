<script type="module">

/* =========================================================
   PROGRESSION - même sauvegarde que le jeu 2D
   ========================================================= */
const RANKS = [
  { xp: 0, name: 'Recrue civile' }, { xp: 200, name: 'Cadet de la République' },
  { xp: 600, name: 'Élève gardien de la paix' }, { xp: 1300, name: 'Gardien de la paix stagiaire' },
  { xp: 2300, name: 'Gardien de la paix' }, { xp: 3700, name: 'GPX - Chef de bord' },
  { xp: 5500, name: 'GPX - Chef de patrouille' }, { xp: 7500, name: 'Candidat Brigadier-Chef' },
  { xp: 9000, name: 'Brigadier-Chef' }
];
const THEME_LABEL = { A: 'Régimes', B: 'Services supp.', C: 'Congés', D: 'Astreinte', E: 'RPS',
  F: 'TSI', G: 'Déontologie', H: 'Management', I: 'Pratiques pro. intervention' };

function hash(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
const QS = (typeof Q !== 'undefined' ? Q : []).map(x => ({ id: hash(x.t + '|' + x.q), t: x.t, q: x.q, o: x.o.slice(), a: x.a, e: x.e, s: x.s }));

const KEY = 'objectif-bc-v1';
let S;
try { S = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { S = {}; }
S.xp = S.xp || 0; S.q = S.q || {}; S.stats = S.stats || { answered: 0, correct: 0, best: 0, wins: 0, battles: 0 };
if (S.sound === undefined) S.sound = true;
S.d3 = Object.assign({ intro: false, done: {}, ended: false }, S.d3 || {});
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function rankIdx() { let r = 0; RANKS.forEach((k, i) => { if (S.xp >= k.xp) r = i; }); return r; }
function lvl(id) { return (S.q[id] && S.q[id].l) || 0; }

/* =========================================================
   SONS (WebAudio, pas de fichiers)
   ========================================================= */
let AC = null, musBus = null, radioStarted = false;
function ac() {
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); musBus = AC.createGain(); musBus.connect(AC.destination); } catch (e) {}
  }
  if (AC && AC.state === 'suspended' && !document.hidden) AC.resume();
  // La musique démarre au premier geste du joueur (règle des navigateurs)
  if (AC && !radioStarted) { radioStarted = true; setTimeout(() => radioPlay(R.st, true), 0); }
  return AC;
}
function tone(f, d, type = 'square', v = .08, when = 0) {
  if (!S.sound) return; const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + when;
  o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d);
}
const SFX = {
  ok() { tone(660, .1); tone(880, .15, 'square', .08, .09); },
  ko() { tone(200, .25, 'sawtooth', .07); },
  talk() { tone(520, .05, 'triangle', .05); },
  win() { [523, 659, 784, 1046].forEach((f, i) => tone(f, .18, 'square', .07, i * .12)); },
  door() { tone(300, .08, 'triangle', .08); tone(450, .08, 'triangle', .08, .08); }
};
let sirenNode = null;
function sirenSet(on) {
  if (sirenNode) { try { sirenNode.o.stop(); } catch (e) {} sirenNode = null; }
  if (!on || !S.sound) return; const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), lfo = a.createOscillator(), lg = a.createGain();
  o.type = 'square'; o.frequency.value = 520; lfo.type = 'square'; lfo.frequency.value = 1.6; lg.gain.value = 95;
  lfo.connect(lg); lg.connect(o.frequency); g.gain.value = .035; o.connect(g); g.connect(a.destination);
  o.start(); lfo.start(); sirenNode = { o, lfo }; o.onended = () => { try { lfo.stop(); } catch (e) {} };
}

/* ---------- Musiques du jeu (chiptune, reprises du jeu 2D) ---------- */
// Une case = une croche. "-" prolonge la note précédente.
const SONGS = {
  map: { bpm: 132,
    lead: ['E5 - G5 - C6 - G5 E5', 'A5 - G5 E5 C5 - E5 -', 'F5 - A5 - C6 - A5 F5', 'G5 - - - D5 - B4 -',
           'E5 - G5 - C6 - D6 E6', 'D6 - C6 A5 E5 - A5 -', 'F5 G5 A5 - C6 - B5 A5', 'G5 - B5 - D6 - - -'],
    chords: ['C4', 'A3', 'F3', 'G3', 'C4', 'A3', 'F3', 'G3'], minor: [0, 1, 0, 0, 0, 1, 0, 0],
    bass: ['C3', 'A2', 'F2', 'G2', 'C3', 'A2', 'F2', 'G2'], drums: 'k h s h k h s h' },
  battle: { bpm: 168,
    lead: ['A4 - C5 - E5 - A5 G5', 'F5 - E5 - C5 - A4 -', 'G4 - B4 - D5 - G5 F5', 'E5 - - - G#4 - B4 -',
           'A5 - G5 - E5 - A5 B5', 'C6 - B5 A5 F5 - A5 -', 'B5 - A5 G5 D5 - G5 -', 'E5 - G#5 - B5 - E6 -'],
    chords: ['A3', 'F3', 'G3', 'E3', 'A3', 'F3', 'G3', 'E3'], minor: [1, 0, 0, 0, 1, 0, 0, 0],
    bass: ['A2', 'F2', 'G2', 'E2', 'A2', 'F2', 'G2', 'E2'], drums: 'k h s k k h s h' },
  arcade: { bpm: 150,
    lead: ['G5 - E5 G5 C6 - G5 -', 'A5 - F5 A5 D6 - A5 -', 'B5 - G5 B5 D6 - B5 G5', 'C6 - - - E6 - D6 C6',
           'E6 - C6 E6 G6 - E6 -', 'F6 - D6 F6 A5 - C6 -', 'D6 - B5 D6 G5 - B5 D6', 'C6 - G5 - E5 - C5 -'],
    chords: ['C4', 'F3', 'G3', 'C4', 'A3', 'D3', 'G3', 'C4'], minor: [0, 0, 0, 0, 1, 1, 0, 0],
    bass: ['C3', 'F2', 'G2', 'C3', 'A2', 'D3', 'G2', 'C3'], drums: 'k h s h k h s h' },
  nuit: { bpm: 96,
    lead: ['A4 - - C5 E5 - D5 C5', 'B4 - - - G4 - - -', 'F4 - A4 - C5 - B4 A4', 'G#4 - - - E4 - - -',
           'A4 - C5 - E5 - A5 -', 'G5 - F5 E5 D5 - C5 -', 'D5 - C5 B4 A4 - G#4 -', 'A4 - - - - - - -'],
    chords: ['A3', 'G3', 'F3', 'E3', 'A3', 'C4', 'D3', 'A3'], minor: [1, 0, 0, 0, 1, 0, 1, 1],
    bass: ['A2', 'G2', 'F2', 'E2', 'A2', 'C3', 'D3', 'A2'], drums: 'k . s . k k s .' }
};
const NOTE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function midi(n) { const m = n.match(/^([A-G])(#?)(\d)$/); return 12 * (+m[3] + 1) + NOTE[m[1]] + (m[2] ? 1 : 0); }
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
function compile(song) {
  const lead = []; let last = null;
  song.lead.join(' ').split(/\s+/).forEach(tk => {
    if (tk === '-') { if (last) last.len++; lead.push(null); return; }
    last = tk === '.' ? null : { m: midi(tk), len: 1 }; lead.push(last);
  });
  return Object.assign({}, song, { leadC: lead, steps: lead.length, drumC: song.drums.split(' ') });
}
const SONGS_C = {}; for (const k in SONGS) SONGS_C[k] = compile(SONGS[k]);
let noiseBuf = null;
function noise() {
  if (!noiseBuf) { noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.3, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  return noiseBuf;
}
function voice(type, f, t, dur, vol) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.008);
  g.gain.setValueAtTime(vol, t + dur * 0.7); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(musBus); o.start(t); o.stop(t + dur + 0.02);
}
function drum(kind, t) {
  if (kind === 'k') {
    const o = AC.createOscillator(), g = AC.createGain();
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
    g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
    o.connect(g); g.connect(musBus); o.start(t); o.stop(t + 0.15); return;
  }
  const src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  src.buffer = noise(); f.type = 'highpass'; f.frequency.value = kind === 's' ? 1200 : 6000;
  const v = kind === 's' ? 0.22 : 0.07, d = kind === 's' ? 0.12 : 0.04;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  src.connect(f); f.connect(g); g.connect(musBus); src.start(t); src.stop(t + d + 0.01);
}
const MUS = { song: null, step: 0, next: 0, timer: null };
function musicTick() {
  const sg = SONGS_C[MUS.song]; if (!sg || !AC || AC.state !== 'running') return;
  const e = 60 / sg.bpm / 2;
  while (MUS.next < AC.currentTime + 0.15) {
    if (MUS.next < AC.currentTime - 0.2) MUS.next = AC.currentTime + 0.02;
    const i = MUS.step, bar = Math.floor(i / 8), pos = i % 8, n = sg.leadC[i];
    if (n) voice('square', hz(n.m), MUS.next, e * n.len * 0.95, 0.07);
    voice('triangle', hz(midi(sg.bass[bar]) + (pos % 2 ? 12 : 0)), MUS.next, e * 0.9, 0.22);
    const root = midi(sg.chords[bar]), arp = [root, root + (sg.minor[bar] ? 3 : 4), root + 7, root + 12];
    voice('square', hz(arp[(pos * 2) % 4]), MUS.next, e * 0.45, 0.022);
    voice('square', hz(arp[(pos * 2 + 1) % 4]), MUS.next + e / 2, e * 0.45, 0.022);
    const d = sg.drumC[pos]; if (d && d !== '.') drum(d, MUS.next);
    MUS.next += e; MUS.step = (MUS.step + 1) % sg.steps;
  }
}
function playSong(name) {
  if (!AC) return; if (MUS.song === name) return;
  MUS.song = name; MUS.step = 0; MUS.next = AC.currentTime + 0.08;
  if (!MUS.timer) MUS.timer = setInterval(musicTick, 25);
}
function stopSong() { MUS.song = null; }

function radioPlay(id, quiet) {
  const st = STATIONS.find(s => s.id === id) || STATIONS[0];
  R.st = st.id; S.d3.radio = { st: R.st, vol: R.vol, on: R.on }; save();
  radioStop(); R.cur = st.id;
  if (!R.on || !AC) { radioUi(); return; }
  if (st.song) { playSong(st.song); radioApplyVol(); }
  else if (navigator.onLine === false) { R.cur = 'bcfm'; playSong('map'); radioApplyVol(); toast('📻 Pas de réseau - BC FM prend le relais'); }
  else {
    if (!R.el) { R.el = new Audio(); R.el.preload = 'none'; }
    R.el.src = st.url; radioApplyVol();
    R.el.onerror = () => radioFallback('flux indisponible');
    R.el.onplaying = () => { clearTimeout(R.wait); if (!quiet) toast('📻 ' + st.name + ' - en direct'); };
    const p = R.el.play(); if (p && p.catch) p.catch(e => { if (e && e.name !== 'AbortError') radioFallback(); });
    R.wait = setTimeout(() => { if (R.el && (R.el.paused || R.el.readyState < 2)) radioFallback('pas de réseau ?'); }, 12000);

}

/* =========================================================
   LA VILLE - tuiles de 8 m, 15 × 15
   ========================================================= */
const T = 8;
const MAP = [
  '###############',
  '#RRRRRRRRRRRRR#',
  '#RP.BSBRBF.SBR#',
  '#R....BRBT.THR#',
  '#RH...HRH.G.HR#',
  '#RBT.TBRBT.TBR#',
  '#RSB.BSRSB.HBR#',
  '#RRRRRRRRRRRRR#',
  '#RMB.BSRBS.BIR#',
  '#R....BRB....R#',
  '#RH.V.HRH.T.BR#',
  '#RBT.TBRS...SR#',
  '#RHH.HHRBE.BSR#',
  '#RRRRRRRRRRRRR#',
  '###############'
];
const at = (r, c) => (MAP[r] && MAP[r][c]) || '#';
const isRoad = (r, c) => at(r, c) === 'R';
const tc = (r, c) => new THREE.Vector3((c - 7) * T, 0, (r - 7) * T);
const LIMIT = 6 * T + 3.6;

const boxes = [];      // obstacles AABB en XZ : {x0,x1,z0,z1}
const bldgs = [];      // bâtiments, pour le fondu quand ils cachent le joueur
const circles = [];    // obstacles ronds : {x,z,r}
function addBox(obj, shrink = 0.15) {
  obj.updateMatrixWorld(true);
  const b = new THREE.Box3().setFromObject(obj);
  boxes.push({ x0: b.min.x + shrink, x1: b.max.x - shrink, z0: b.min.z + shrink, z1: b.max.z - shrink });
}

const rnd = (() => { let s = 1234567; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
const pick = a => a[Math.floor(rnd() * a.length)];

// Direction de la façade : vers la route voisine.
const DIRS = [[-1, 0], [0, 1], [1, 0], [0, -1]];   // nord, est, sud, ouest
function facing(r, c) {
  for (const [dr, dc] of DIRS) if (isRoad(r + dr, c + dc)) return [dr, dc];
  for (const [dr, dc] of DIRS) if (at(r + dr, c + dc) === '.') return [dr, dc];
  return [1, 0];
}
const yawOf = (dr, dc) => Math.atan2(dc, dr);   // modèle Kenney tourné vers +Z

const SPOTS = {};      // emplacements des lieux importants
const SIGNS = { P: ['POLICE', 'NATIONALE', '#002395'], M: ['MAIRIE', 'Service RH', '#7c3aed'], F: ['CENTRE DES', 'FINANCES', '#0f766e'],
                I: ['INSPECTION', 'Déontologie', '#334155'], E: ['HÔTEL DE POLICE', 'Salle d\'examen', '#b91c1c'] };

function signMesh(l1, l2, col) {
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 192;
  const x = cv.getContext('2d');
  x.fillStyle = col; x.fillRect(0, 0, 512, 192); x.fillStyle = '#fff'; x.fillRect(8, 8, 496, 176); x.fillStyle = col; x.fillRect(16, 16, 480, 160);
  x.fillStyle = '#fff'; x.textAlign = 'center';
  x.font = '900 64px system-ui, sans-serif'; x.fillText(l1, 256, 88, 450);
  x.font = '700 44px system-ui, sans-serif'; x.fillText(l2, 256, 150, 450);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  return new THREE.Mesh(new THREE.PlaneGeometry(4.2, 1.6), new THREE.MeshBasicMaterial({ map: tex }));
}

function buildCity() {
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(15 * T, 15 * T), new THREE.MeshLambertMaterial({ color: 0xc9c5bb }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  const far = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshLambertMaterial({ color: 0x7cb35a }));
  far.rotation.x = -Math.PI / 2; far.position.y = -0.02; scene.add(far);
  const grassMat = new THREE.MeshLambertMaterial({ color: 0x86c06a });
  const grassGeo = new THREE.PlaneGeometry(T, T);

  const commerce = MODELS.ville.filter(n => /building-[a-n]$/.test(n));
  const tours = MODELS.ville.filter(n => n.includes('skyscraper'));
  const maisons = MODELS.quartier.filter(n => n.startsWith('building-type'));

  for (let r = 0; r < 15; r++) for (let c = 0; c < 15; c++) {
    const ch = at(r, c), p = tc(r, c);
    if (ch === 'R') {
      const n = isRoad(r - 1, c), e = isRoad(r, c + 1), s = isRoad(r + 1, c), w = isRoad(r, c - 1);
      const cnt = n + e + s + w;
      let name = 'road-straight', yaw = 0;
      if (cnt === 4) name = 'road-crossroad';
      else if (cnt === 3) { name = 'road-intersection'; yaw = !n ? 0 : !e ? -Math.PI / 2 : !s ? Math.PI : Math.PI / 2; yaw += ROAD_T_OFFSET; }
      else if (cnt === 2 && !(n && s) && !(e && w)) { name = 'road-bend'; yaw = (s && e) ? 0 : (s && w) ? -Math.PI / 2 : (n && w) ? Math.PI : Math.PI / 2; yaw += ROAD_BEND_OFFSET; }
      else yaw = (e || w) ? Math.PI / 2 + ROAD_STRAIGHT_OFFSET : ROAD_STRAIGHT_OFFSET;
      const m = clone(name); m.position.copy(p); m.rotation.y = yaw; m.scale.set(T, T, T); scene.add(m);
      // lampadaires le long des routes droites
      if (name === 'road-straight' && (r + c) % 3 === 0) {
        const l = clone('light-square'); l.scale.setScalar(5);
        const side = (e || w) ? new THREE.Vector3(0, 0, 3.7) : new THREE.Vector3(3.7, 0, 0);
        l.position.copy(p).add(side); l.rotation.y = (e || w) ? Math.PI : -Math.PI / 2; scene.add(l);
        circles.push({ x: l.position.x, z: l.position.z, r: 0.25 });
      }
      continue;
    }
    if (ch === '#') {
      if ((r + c) % 2 === 0) { const t = clone(rnd() < .5 ? 'tree-large' : 'tree-small'); t.position.copy(p).add(new THREE.Vector3(rnd() * 3 - 1.5, 0, rnd() * 3 - 1.5)); t.scale.setScalar(7 + rnd() * 3); t.rotation.y = rnd() * 6; scene.add(t); }
      continue;
    }
    if (ch === 'T' || ch === 'G' || ch === 'V') {
      const g = new THREE.Mesh(grassGeo, grassMat); g.rotation.x = -Math.PI / 2; g.position.copy(p); g.position.y = 0.02; g.receiveShadow = true; scene.add(g);
      if (ch === 'T') {
        for (let i = 0; i < 2; i++) { const t = clone(i ? 'tree-small' : 'tree-large'); t.scale.setScalar(6 + rnd() * 2); t.position.copy(p).add(new THREE.Vector3(i ? 2 : -1.5, 0, i ? -1.8 : 1.5)); t.rotation.y = rnd() * 6; scene.add(t); circles.push({ x: t.position.x, z: t.position.z, r: 0.6 }); }
      }
      SPOTS[ch + r + '_' + c] = p.clone();
      if (ch !== 'T') SPOTS[ch] = p.clone();
      continue;
    }
    if (ch === '.') continue;
    // Bâtiments
    const [dr, dc] = facing(r, c);
    let name, sc = 6;
    if (ch === 'S') { name = pick(tours); sc = 5; }
    else if (ch === 'H') { name = pick(maisons); sc = 5.5; }
    else if (ch === 'B') name = pick(commerce);
    else name = { P: 'building-d', M: 'building-h', F: 'building-skyscraper-a', I: 'building-k', E: 'building-skyscraper-e' }[ch];
    const m = clone(name); m.scale.setScalar(sc); m.rotation.y = yawOf(dr, dc) + BUILDING_OFFSET;
    m.position.copy(p).add(new THREE.Vector3(-dc * 0.6, 0, -dr * 0.6));
    scene.add(m); addBox(m);
    m.traverse(o => { if (o.isMesh) o.material = o.material.clone(); });
    bldgs.push({ m, box: new THREE.Box3().setFromObject(m), faded: false });
    if (SIGNS[ch]) {
      const [a, b, col] = SIGNS[ch];
      const sg = signMesh(a, b, col);
      const bb = new THREE.Box3().setFromObject(m);
      const half = Math.abs(dr) ? (bb.max.z - bb.min.z) / 2 : (bb.max.x - bb.min.x) / 2;
      const ctr = bb.getCenter(new THREE.Vector3());
      sg.position.set(ctr.x + dc * (half + 0.08), 4.2, ctr.z + dr * (half + 0.08));
      sg.rotation.y = yawOf(dr, dc);
      scene.add(sg);
      SPOTS[ch] = p.clone().add(new THREE.Vector3(dc * 3.1, 0, dr * 3.1));
      SPOTS[ch + 'dir'] = [dr, dc];
    }
  }
  // bordure : barrières invisibles via LIMIT
}
// Corrections d'orientation des tuiles Kenney (vérifiées à l'écran)
const ROAD_STRAIGHT_OFFSET = Math.PI / 2, ROAD_T_OFFSET = 0, ROAD_BEND_OFFSET = Math.PI / 2, BUILDING_OFFSET = 0;

   PERSONNAGES
   ========================================================= */
class Char {
  constructor(model, scale = 2.2) {
    this.root = SkeletonUtils.clone(G[model].scene);
    this.root.scale.setScalar(scale);
    this.mixer = new THREE.AnimationMixer(this.root);
    this.clips = {}; G[model].animations.forEach(c => this.clips[c.name] = c);
    this.cur = null; scene.add(this.root);
  }
  play(name, fade = .2, once = false) {
    if (this.curName === name) return; const clip = this.clips[name]; if (!clip) return;
    const a = this.mixer.clipAction(clip);
    if (once) { a.setLoop(THREE.LoopOnce); a.clampWhenFinished = true; }
    a.reset().fadeIn(fade).play(); if (this.cur) this.cur.fadeOut(fade);
    this.cur = a; this.curName = name;
  }
  face(x, z) { this.root.rotation.y = Math.atan2(x - this.root.position.x, z - this.root.position.z); }
}

/* =========================================================
   COLLISIONS
   ========================================================= */
function collide(pos, rad) {
  let hit = false;
  for (const b of boxes) {
    const cx = Math.max(b.x0, Math.min(pos.x, b.x1)), cz = Math.max(b.z0, Math.min(pos.z, b.z1));
    const dx = pos.x - cx, dz = pos.z - cz, d2 = dx * dx + dz * dz;
    if (d2 < rad * rad) {
      hit = true;
      if (d2 > 1e-6) { const d = Math.sqrt(d2); pos.x = cx + dx / d * rad; pos.z = cz + dz / d * rad; }
      else { // centre dans la boîte : sortir par le côté le plus proche
        const l = pos.x - b.x0, r = b.x1 - pos.x, t = pos.z - b.z0, bo = b.z1 - pos.z, mn = Math.min(l, r, t, bo);
        if (mn === l) pos.x = b.x0 - rad; else if (mn === r) pos.x = b.x1 + rad; else if (mn === t) pos.z = b.z0 - rad; else pos.z = b.z1 + rad;
      }
    }
  }
  for (const c of circles) {
    const dx = pos.x - c.x, dz = pos.z - c.z, d = Math.hypot(dx, dz), R = rad + c.r;
    if (d < R && d > 1e-6) { pos.x = c.x + dx / d * R; pos.z = c.z + dz / d * R; hit = true; }
  }
  if (Math.abs(pos.x) > LIMIT) { pos.x = Math.sign(pos.x) * LIMIT; hit = true; }
  if (Math.abs(pos.z) > LIMIT) { pos.z = Math.sign(pos.z) * LIMIT; hit = true; }
  return hit;
}

const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();

function angDiff(a, b) { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; }

function update(dt) {
  t0 += dt;
  const inp = (uiOpen() || FREEZE) ? { x: 0, z: 0, m: 0 } : readInput();
  if (!P.inCar) {
    if (inp.m > 0.12) {
      const sp = inp.m > 0.8 ? 6.5 : 3.6 * inp.m + 1;
      P.pos.x += inp.x / inp.m * sp * inp.m * dt; P.pos.z += inp.z / inp.m * sp * inp.m * dt;
      player.root.rotation.y += angDiff(player.root.rotation.y, Math.atan2(inp.x, inp.z)) * Math.min(1, dt * 12);
      player.play(inp.m > 0.8 ? 'sprint' : 'walk');
    } else player.play('idle');
    collide(P.pos, .4);
    // ne pas traverser la voiture garée
    const dx = P.pos.x - CAR.pos.x, dz = P.pos.z - CAR.pos.z, d = Math.hypot(dx, dz);
    if (d < 1.9 && d > 1e-4) { P.pos.x = CAR.pos.x + dx / d * 1.9; P.pos.z = CAR.pos.z + dz / d * 1.9; }
    player.root.position.copy(P.pos);
  } else {
    // Conduite : la voiture s'oriente vers la direction du joystick
    if (inp.m > 0.15) {
      const target = Math.atan2(inp.x, inp.z), diff = angDiff(CAR.yaw, target);
      const rev = Math.abs(diff) > 2.4 && CAR.v < 2;
      if (rev) CAR.v = Math.max(-5, CAR.v - 10 * dt);
      else { CAR.v = Math.min(17 * inp.m, CAR.v + 12 * dt); CAR.yaw += diff * Math.min(1, dt * 2.6 * Math.min(1, Math.abs(CAR.v) / 4)); }
    } else CAR.v *= Math.pow(0.25, dt);
    if (Math.abs(CAR.v) < 0.05) CAR.v = 0;
    CAR.pos.x += Math.sin(CAR.yaw) * CAR.v * dt; CAR.pos.z += Math.cos(CAR.yaw) * CAR.v * dt;
    if (collide(CAR.pos, 1.5)) { if (Math.abs(CAR.v) > 6) { SFX.ko(); buzz(40); } CAR.v *= 0.4; }
    P.pos.copy(CAR.pos);
  }

  CAR.wheels.forEach(w => { w.o.rotation.x += CAR.v * dt * 2.2; });

    n.mk.visible = on; n.mk.position.y = 1.25 + Math.sin(t0 * 3) * .06;
    const st = !!S.d3.done[n.m.id];
    if (n.st !== st) { n.st = st; n.mk.material.map = st ? MK.done : MK.todo; n.mk.material.needsUpdate = true; }
    if (d < 6 && !P.inCar) n.ch.root.rotation.y += angDiff(n.ch.root.rotation.y, Math.atan2(P.pos.x - n.ch.root.position.x, P.pos.z - n.ch.root.position.z)) * Math.min(1, dt * 4);
    if (on && d < best) { best = d; near = n; }
  }

  for (const c of traffic) {
    const r = c.ring, w = r.x1 - r.x0, h = r.z1 - r.z0, per = 2 * (w + h), lane = 2;
    const pos = s => { let u = ((s % 1) + 1) % 1 * per; if (u < w) return [r.x0 + u, r.z0 + lane, Math.PI / 2]; u -= w; if (u < h) return [r.x1 - lane, r.z0 + u, 0]; u -= h; if (u < w) return [r.x1 - u, r.z1 - lane, -Math.PI / 2]; u -= w; return [r.x0 + lane, r.z1 - u, Math.PI]; };

    const blocked = Math.hypot(ahead[0] - P.pos.x, ahead[1] - P.pos.z) < 4.5 || traffic.some(o => o !== c && ((o.s - c.s) % 1 + 1) % 1 < 9 / per);

    const [x, z, yaw] = pos(c.s); c.m.position.set(x, 0, z);

  if (GAME) { near = null; GAME.update(dt); }
  callTick(dt);
  // Action contextuelle
  const act = $('act');
  let label = null;
  if (P.inCar) label = Math.abs(CAR.v) < 4 && (!GAME || GAME.exitOk) ? 'Descendre' : null;
  else if (GAME && GAME.actLabel && GAME.actLabel()) label = GAME.actLabel();
  else if (near) label = 'Parler';
  else if (P.pos.distanceTo(CAR.pos) < 3.4 && (!GAME || GAME.carOk)) label = 'Monter 🚓';
  act.classList.toggle('hidden', !label || uiOpen()); if (label) act.textContent = label;
  $('siren').classList.toggle('hidden', !P.inCar || uiOpen());

  // Objectif
  const nm = GAME ? null : nextMission();
  const gobj = GAME && GAME.objective();
  if (nm || gobj) {
    const tgt = gobj || SPOTS[nm.spot]; beacon.visible = true; beacon.position.x = tgt.x; beacon.position.z = tgt.z;
    const dx = tgt.x - P.pos.x, dz = tgt.z - P.pos.z, dist = Math.hypot(dx, dz);
    $('objArrow').style.transform = `rotate(${Math.atan2(dx, -dz)}rad)`;

    beacon.material.color.setHex(gobj && gobj.col || 0xf4c430);
    beacon.material.opacity = dist < 8 ? .1 : .28;
  } else if (GAME) { beacon.visible = false; $('objTxt').textContent = GAME.name; } else { beacon.visible = false; $('objArrow').style.transform = ''; $('objTxt').textContent = 'Brigadier-Chef ! Patrouille libre - révise avec tout le monde'; }

  const back = P.inCar ? (portrait ? 30 : 19) : (portrait ? 21 : 12), up = P.inCar ? (portrait ? 31 : 19) : (portrait ? 22 : 11);
  const look = P.inCar ? CAR.pos.clone().add(new THREE.Vector3(Math.sin(CAR.yaw) * CAR.v * .35, 0, Math.cos(CAR.yaw) * CAR.v * .35)) : P.pos.clone();

  const head = P.pos.clone(); head.y = 1;
  const dir = head.clone().sub(camera.position), dist = dir.length(); dir.normalize();
  const ray = new THREE.Ray(camera.position, dir), hitP = new THREE.Vector3();

      b.m.traverse(o => { if (o.isMesh) { o.material.transparent = f; o.material.opacity = f ? 0.22 : 1; o.material.depthWrite = !f; o.castShadow = !f; } });
    }

}

/* Dialogue */
function dialog(lines, done) {
  let i = 0; $('dlg').classList.remove('hidden');
  const show = () => {
    const [name, role, txt, btns] = lines[i];
    $('dlgName').textContent = name; $('dlgRole').textContent = role; $('dlgTxt').textContent = txt; SFX.talk();
    const b = $('dlgBtns'); b.innerHTML = '';
    if (btns) btns.forEach(([lab, fn, cls]) => { const x = document.createElement('button'); x.className = 'btn ' + (cls || ''); x.textContent = lab; x.onclick = () => { $('dlg').classList.add('hidden'); fn && fn(); }; b.appendChild(x); });
    else { const x = document.createElement('button'); x.className = 'btn'; x.textContent = i < lines.length - 1 ? 'Suivant ▶' : 'OK'; x.onclick = () => { i++; if (i < lines.length) show(); else { $('dlg').classList.add('hidden'); done && done(); } }; b.appendChild(x); }
  };
  show();
}

function talk(m) {
  const done = S.d3.done[m.id];
  const L = done
    ? [[m.who, m.role, m.boss ? 'Vous êtes déjà brigadier-chef ! Envie de repasser une épreuve blanche pour garder la main ?' : 'Merci encore pour le dossier ! Tu veux réviser à nouveau ce thème avec moi ?']]
    : m.intro.map(t => [m.who, m.role, t]);
  const last = L[L.length - 1];
  L[L.length - 1] = [last[0], last[1], last[2], [[done ? 'Réviser (' + m.n + ' questions)' : 'C\'est parti !', () => startQuiz(m)], ['Plus tard', null, 'alt']]];
  dialog(L);
}

/* Quiz */
let QZ = null;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function startQuiz(m) {
  const pool = m.themes === 'ALL' ? QS : QS.filter(q => m.themes.includes(q.t));
  if (!pool.length) { toast('Aucune question trouvée pour ce thème.'); return; }
  const qs = pool.map(q => ({ q, k: lvl(q.id) + Math.random() * 1.6 })).sort((a, b) => a.k - b.k).slice(0, m.n).map(x => x.q);
  shuffle(qs);
  QZ = { m, qs: qs.map(q => { const idx = shuffle(q.o.map((_, i) => i)); return { ...q, o: idx.map(i => q.o[i]), a: idx.indexOf(q.a) }; }), i: 0, ok: 0, res: [], combo: 0 };
  $('quiz').classList.remove('hidden'); showQ();
}
function showQ() {
  const q = QZ.qs[QZ.i];
  $('qTheme').textContent = THEME_LABEL[q.t] || q.t;
  $('qPips').innerHTML = QZ.qs.map((_, i) => `<i class="pip ${QZ.res[i] === true ? 'ok' : QZ.res[i] === false ? 'ko' : ''} ${i === QZ.i ? 'cur' : ''}"></i>`).join('');
  $('qQ').textContent = q.q;
  const box = $('qOpts'); box.innerHTML = '';
  q.o.forEach((o, i) => { const b = document.createElement('button'); b.className = 'opt'; b.textContent = o; b.onclick = () => answer(i, b); box.appendChild(b); });
  $('qExp').classList.add('hidden'); $('qNext').classList.add('hidden');
}
function answer(i, btn) {
  if (QZ.answered) return; QZ.answered = true;
  const q = QZ.qs[QZ.i], ok = i === q.a;
  const st = S.q[q.id] || (S.q[q.id] = { l: 0, c: 0, w: 0 }); st.ts = Date.now(); st.lastOk = ok;
  S.stats.answered++;
  [...document.querySelectorAll('.opt')].forEach((b, j) => { b.disabled = true; if (j === q.a) b.classList.add('ok'); });
  let msg;
  if (ok) {
    const before = st.l; st.c++; st.l = Math.min(3, st.l + 1); QZ.ok++; QZ.combo++; S.stats.correct++; S.stats.best = Math.max(S.stats.best || 0, QZ.combo);
    let gain = 10 + Math.min(QZ.combo - 1, 5) * 2; if (before < 3 && st.l === 3) gain += 15;
    S.xp += gain; floatXP('+' + gain + ' XP', btn); SFX.ok(); buzz(20);
    msg = '✅ <b>Bonne réponse !</b> ' + '★'.repeat(st.l) + '☆'.repeat(3 - st.l);
  } else {
    st.w++; st.l = 0; QZ.combo = 0; btn.classList.add('ko'); SFX.ko(); buzz([60, 40, 60]);
    msg = '❌ <b>Raté.</b>';
  }
  QZ.res[QZ.i] = ok;
  $('qPips').children[QZ.i].className = 'pip cur ' + (ok ? 'ok' : 'ko');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  $('qExp').innerHTML = msg + '<br>' + esc(q.e).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>') + (q.s ? '<br><small><i>📌 Source : ' + esc(q.s) + '</i></small>' : ''); $('qExp').classList.remove('hidden');
  $('qNext').textContent = QZ.i < QZ.qs.length - 1 ? 'Suivant ▶' : 'Terminer ▶'; $('qNext').classList.remove('hidden');
  save(); hud();
  $('qExp').scrollIntoView({ block: 'nearest' });
}
$('qNext').addEventListener('click', () => {
  QZ.answered = false; QZ.i++;
  if (QZ.i < QZ.qs.length) return showQ();
  $('quiz').classList.add('hidden');
  if (QZ.m.onEnd) return QZ.m.onEnd(QZ.ok >= QZ.m.need, QZ.ok);
  const m = QZ.m, win = QZ.ok >= m.need, first = win && !S.d3.done[m.id];
  const score = `${QZ.ok}/${QZ.qs.length} bonnes réponses`;
  if (win) {
    const bonus = first ? (m.boss ? 300 : 50) : 10; S.xp += bonus; S.d3.done[m.id] = true; S.stats.wins = (S.stats.wins || 0) + 1;
    SFX.win(); confetti(m.boss ? 160 : 60); save(); hud();
    const lines = [[m.who, m.role, (first ? m.win : 'Toujours au top !') + `  (${score} · +${bonus} XP bonus)`]];
    if (first && m.boss) { S.d3.ended = true; save(); lines.push(['Capitaine Moreau', 'Chef de service', 'Bravo, Brigadier-Chef ! Saint-Zaïdou est fier de toi. Le quartier reste ouvert : chaque dossier peut être révisé à volonté.']); }
    dialog(lines, () => { const n = nextMission(); if (first && n) toast('📻 Radio : prochain dossier - ' + n.place + ' (' + n.who + ')', 5000); else if (first && n === null && !m.boss) toast('📻 Tous les dossiers sont bouclés !'); });
  } else {
    dialog([[m.who, m.role, m.lose + `  (${score}, il en fallait ${m.need})`]]);
  }
});
function floatXP(t, el) { const r = el.getBoundingClientRect(), f = document.createElement('div'); f.className = 'floatxp'; f.textContent = t; f.style.left = (r.left + r.width / 2 - 30) + 'px'; f.style.top = (r.top - 6) + 'px'; document.body.appendChild(f); setTimeout(() => f.remove(), 1200); }
function confetti(n) { const cols = ['#002395', '#ffffff', '#ed2939', '#f4c430']; for (let i = 0; i < n; i++) { const c = document.createElement('div'); c.className = 'confetti'; c.style.left = Math.random() * 100 + 'vw'; c.style.background = cols[i % 4]; c.style.animationDuration = (1.8 + Math.random() * 1.8) + 's'; c.style.animationDelay = Math.random() * .6 + 's'; document.body.appendChild(c); setTimeout(() => c.remove(), 4500); } }

/* =========================================================
   CELLULE DE GARDE À VUE - les voleurs attrapés y restent
   ========================================================= */
const JAIL = { c: null, inmates: [] };
const THIEF_MODELS = ['character-male-a', 'character-male-e', 'character-female-a', 'character-male-f', 'character-female-c', 'character-male-b'];
function tint(ch, hex) {
  ch.root.traverse(o => { if (o.isMesh) { if (!o.userData.own) { o.material = o.material.clone(); o.userData.own = true; } o.material.color.setHex(hex); } });
}
function buildJail() {
  const c = tc(4, 4); JAIL.c = c;
  const floor = new THREE.Mesh(new THREE.BoxGeometry(6, 0.1, 6), new THREE.MeshLambertMaterial({ color: 0x8a8f99 }));
  floor.position.set(c.x, 0.05, c.z); floor.receiveShadow = true; scene.add(floor);
  const barMat = new THREE.MeshLambertMaterial({ color: 0x2b2f36 }), barGeo = new THREE.BoxGeometry(0.1, 2.6, 0.1);
  for (let i = 0; i <= 12; i++) {
    const k = -3 + i * 0.5;
    [[k, -3], [k, 3], [-3, k], [3, k]].forEach(([x, z]) => { const b = new THREE.Mesh(barGeo, barMat); b.position.set(c.x + x, 1.35, c.z + z); b.castShadow = true; scene.add(b); });
  }
  const roof = new THREE.Mesh(new THREE.BoxGeometry(6.3, 0.15, 6.3), barMat); roof.position.set(c.x, 2.7, c.z); scene.add(roof);
  const sg = signMesh('GARDE À VUE', 'Cellule', '#b91c1c'); sg.scale.setScalar(0.8); sg.position.set(c.x, 3.4, c.z + 3.05); scene.add(sg);
  boxes.push({ x0: c.x - 3.1, x1: c.x + 3.1, z0: c.z - 3.1, z1: c.z + 3.1 });
  for (let i = 0; i < Math.min(S.d3.jail || 0, 8); i++) jailShow();
}
function jailShow() {
  if (JAIL.inmates.length >= 8) return;
  const ch = new Char(THIEF_MODELS[JAIL.inmates.length % THIEF_MODELS.length]); tint(ch, 0x4a4a55);
  const k = JAIL.inmates.length; ch.root.position.set(JAIL.c.x - 1.8 + (k % 4) * 1.2, 0.1, JAIL.c.z - 1.2 + Math.floor(k / 4) * 2);
  ch.root.rotation.y = rnd() * 2 - 1; ch.play(k % 3 ? 'idle' : 'sit'); JAIL.inmates.push(ch);
}
function jailAdd(n = 1) { S.d3.jail = (S.d3.jail || 0) + n; for (let i = 0; i < n; i++) jailShow(); save(); hud(); }

   INTERVENTIONS - mini-jeux 3D

let GAME = null, FREEZE = false;
const CAP = 40;   // XP max par mini-jeu et par jour
const today = () => new Date().toLocaleDateString('fr-CA');
function arc3() { const a = S.d3.arc || (S.d3.arc = { best: {}, xp: {}, day: '' }); if (a.day !== today()) { a.day = today(); a.xp = {}; } return a; }
const RC = [1, 7, 13];    // lignes / colonnes des grandes avenues
const nodePos = (i, j) => tc(RC[i], RC[j]);
const fmt = s => s.toFixed(1).replace('.', ',') + ' s';

const OPS = [
  { id: 'course', name: 'Course urgente', ico: '🏁', unlock: 0, sub: 'Un collègue appelle des renforts !',
    how: 'En voiture, passe les 9 points de contrôle le plus vite possible. Le gyrophare est allumé d\'office.' },

];

$('opsBtn').addEventListener('click', () => {
  const a = arc3();
  $('opsList').innerHTML = OPS.map(o => {

  }).join('') + `<div style="margin-top:10px;font-size:13px;color:#5a6687">🔒 En garde à vue : <b>${S.d3.jail || 0}</b> voleur${(S.d3.jail || 0) > 1 ? 's' : ''} - la cellule est derrière le commissariat.</div>`
    + `<div style="margin-top:6px;font-size:13px;color:#5a6687">📻 ${S.d3.calls ? `Prochain appel radio dans ~${Math.max(1, Math.ceil(S.d3.callT / 60))} min de patrouille` : 'Appels radio aléatoires coupés (menu ☰)'}</div>`;
  $('ops').classList.remove('hidden');

$('opsClose').addEventListener('click', () => $('ops').classList.add('hidden'));
$('opsList').addEventListener('click', e => {

  $('ops').classList.add('hidden'); ac();
  if (S.xp < o.unlock) { dialog([['📟 Central', o.name, `Cette intervention se débloque à ${o.unlock} XP. Il te manque ${o.unlock - S.xp} XP : boucle des dossiers et révise pour en gagner !`]]); return; }
  if (GAME) { toast('Termine d\'abord l\'intervention en cours.'); return; }

$('gquit').addEventListener('click', () => {

  dialog([['📟 Central', GAME.name, 'Abandonner l\'intervention en cours ?',
    [['Abandonner', () => GAME && endOp(false, 0, 'Intervention abandonnée.'), 'red'], ['Continuer', null, 'alt']]]]);
});

function startOp(o) {
  GAME = { course: Course, poursuite: Poursuite, pied: APied, chefs: Chefs }[o.id](o);
  GAME.op = o; GAME.name = o.name;
  $('ghud').classList.remove('hidden');

}
function countdown(done) {
  FREEZE = true; let n = 3; const big = $('gbig'); big.classList.remove('hidden');
  const tick = () => {
    if (n > 0) { big.textContent = n; tone(440, .12, 'square', .07); n--; setTimeout(tick, 800); }
    else { big.textContent = 'GO !'; tone(880, .3, 'square', .08); FREEZE = false; done(); setTimeout(() => big.classList.add('hidden'), 700); }
  };

}
function endOp(win, xpRaw, text) {
  const g = GAME; if (!g) return; GAME = null; FREEZE = false;
  try { g.cleanup && g.cleanup(); } catch (e) {}
  $('ghud').classList.add('hidden'); $('gbig').classList.add('hidden');
  const a = arc3(), room = g.nocap ? Infinity : Math.max(0, CAP - (a.xp[g.op.id] || 0)), xp = Math.max(0, Math.min(room, Math.round(xpRaw)));
  if (!g.nocap) a.xp[g.op.id] = (a.xp[g.op.id] || 0) + xp;
  S.xp += xp; save(); hud();
  if (win) { SFX.win(); confetti(60); } else SFX.ko();
  dialog([[g.hdr || '📟 Central', g.op.name, text + (xp ? `  +${xp} XP` : room === 0 && xpRaw > 0 ? '  (plafond d\'XP du jour atteint pour ce jeu)' : '')]]);
}
function putInCar(x, z, yaw) {
  P.inCar = true; player.root.visible = false; CAR.pos.set(x, 0, z); CAR.yaw = yaw; CAR.v = 0; P.pos.copy(CAR.pos);
  camLook.copy(CAR.pos);
}
function putOnFoot(x, z) {

  player.root.visible = true; P.pos.set(x, 0, z); player.root.position.copy(P.pos); camLook.copy(P.pos);
}
function ringMesh(col) {
  const m = new THREE.Mesh(new THREE.RingGeometry(2.6, 3.4, 32), new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: .85, side: THREE.DoubleSide, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.y = 0.08; scene.add(m); return m;
}

/* ---------- 🏁 Course urgente : 9 points de contrôle ---------- */
function Course() {
  const route = [[1, 7], [1, 13], [7, 13], [13, 13], [13, 7], [7, 7], [7, 1], [1, 1], [1, 4]].map(([r, c]) => tc(r, c));
  putInCar(tc(1, 3).x, tc(1, 3).z + 2, Math.PI / 2); setSiren(true);
  const ring = ringMesh(0xf4c430), next = ringMesh(0xffffff); next.scale.setScalar(.6); next.material.opacity = .5;
  const g = { k: 0, t: 0, exitOk: false, carOk: false };
  const place = () => { ring.position.x = route[g.k].x; ring.position.z = route[g.k].z; const n = route[g.k + 1]; next.visible = !!n; if (n) { next.position.x = n.x; next.position.z = n.z; } };
  place();
  g.update = dt => {
    if (FREEZE) return; g.t += dt; ring.rotation.z += dt;
    if (CAR.pos.distanceTo(route[g.k]) < 6) {
      g.k++; tone(988, .08); tone(1319, .12, 'square', .08, .07); buzz(25);
      if (g.k >= route.length) {
        const a = arc3(), rec = a.best.course === undefined || g.t < a.best.course; if (rec) a.best.course = g.t;
        return endOp(true, 10 + Math.max(0, (100 - g.t) / 2.5), `Renforts arrivés en ${fmt(g.t)} !${rec ? ' 🏆 Nouveau record !' : ''}`);
      }
      place();
    }
    if (g.t > 180) return endOp(false, 3, 'Trop tard, les collègues ont dû se débrouiller sans toi…');
    $('gtxt').textContent = `🏁 ${g.k}/${route.length} · ⏱ ${fmt(g.t)}`;
  };
  g.objective = () => ({ x: route[g.k].x, z: route[g.k].z, txt: `Point de contrôle ${g.k + 1}/${route.length}` });
  g.cleanup = () => { scene.remove(ring, next); setSiren(false); };
  return g;
}

/* ---------- 🚗 Course-poursuite : la voiture volée ---------- */
function Poursuite(o, ev) {
  if (!ev) putInCar(tc(1, 2).x, tc(1, 2).z + 2, Math.PI / 2);
  const m = clone('hatchback-sports'); m.scale.setScalar(1.5); scene.add(m);
  const mk = markerSprite('#dc2626', '!'); mk.position.set(0, 1.6, 0); mk.scale.set(.7, .7, 1); m.add(mk);
  const banned = (a, b) => (a[0] === 2 && b[0] === 2 && (a[1] + b[1]) === 1);   // l'accident du boulevard Sud
  const th = { a: ev ? ev.a : [0, 1], b: ev ? ev.b : [0, 2], t: 0, yaw: Math.PI / 2, pos: new THREE.Vector3() };
  const g = { t: 0, bar: 0, LIM: 90, exitOk: !!ev, carOk: !!ev, done: false, phase: ev ? 'aller' : 'fuite', wait: 0 };
  const pickNext = () => {
    const [i, j] = th.b, opts = [[i - 1, j], [i + 1, j], [i, j - 1], [i, j + 1]]
      .filter(([x, y]) => x >= 0 && x < 3 && y >= 0 && y < 3 && !(x === th.a[0] && y === th.a[1]) && !banned(th.b, [x, y]));
    let nx = opts[Math.floor(Math.random() * opts.length)] || th.a;
    if (Math.random() < .65) nx = opts.slice().sort((p, q) => nodePos(...q).distanceTo(P.pos) - nodePos(...p).distanceTo(P.pos))[0] || nx;
    th.a = th.b; th.b = nx; th.t = 0;
  };
  g.update = dt => {
    if (g.done) return;
    if (g.phase === 'aller') {   // appel radio : garée, conducteur à bord, elle démarre quand la patrouille approche
      const d = th.pos.distanceTo(P.pos); g.wait += dt; mk.position.y = 1.6 + Math.sin(t0 * 3) * .1;
      $('gtxt').textContent = `📻 ${ev.title} · ${Math.round(d)} m`;
      if (g.wait > 300) return endOp(false, 0, 'Trop tard : le véhicule a quitté le secteur. Une autre patrouille prend le relais.');
      if (!P.inCar && d < 30 && !g.warned) { g.warned = true; toast('🚓 Prends la voiture de patrouille pour le prendre en chasse !'); }
      if ((P.inCar && d < 30) || d < 8) { g.phase = 'fuite'; g.exitOk = false; g.carOk = !P.inCar; toast(ev.flee); buzz(60); tone(880, .1); tone(660, .15, 'square', .08, .1); }
      return;
    }
    if (!FREEZE) g.t += dt;
    const A = nodePos(...th.a), B = nodePos(...th.b), L = A.distanceTo(B);
    const d0 = th.pos.distanceTo(CAR.pos), sp = FREEZE ? 0 : (d0 < 10 ? 13.5 : 11.5);
    th.t += sp * dt / L; if (th.t >= 1) { pickNext(); }
    const A2 = nodePos(...th.a), B2 = nodePos(...th.b), dir = B2.clone().sub(A2).normalize();
    th.pos.lerpVectors(A2, B2, Math.min(1, th.t)).add(new THREE.Vector3(-dir.z, 0, dir.x).multiplyScalar(2));
    const yaw = Math.atan2(dir.x, dir.z); th.yaw += angDiff(th.yaw, yaw) * Math.min(1, dt * 7);
    m.position.copy(th.pos); m.rotation.y = th.yaw; mk.position.y = 1.6 + Math.sin(t0 * 6) * .1;
    // la voiture volée ne se laisse pas traverser
    const dx = CAR.pos.x - th.pos.x, dz = CAR.pos.z - th.pos.z, d = Math.hypot(dx, dz);
    if (d < 3 && d > 1e-3) { CAR.pos.x = th.pos.x + dx / d * 3; CAR.pos.z = th.pos.z + dz / d * 3; CAR.v *= .5; g.bar += .04; buzz(30); }
    if (FREEZE) return;
    g.bar = Math.max(0, Math.min(1, g.bar + (d < 10 ? dt * (CAR.siren ? .2 : .13) : -dt * .07)));
    if (g.bar >= 1) {
      g.done = true; FREEZE = true; CAR.v = 0;
      const thief = new Char(THIEF_MODELS[(S.d3.jail || 0) % THIEF_MODELS.length]); tint(thief, 0x4a4a55);
      thief.root.position.set(th.pos.x + Math.cos(th.yaw) * 1.8, 0, th.pos.z - Math.sin(th.yaw) * 1.8); thief.play('emote-no');
      g.thief = thief; toast('🚔 Interpellation ! Direction la garde à vue.');
      setTimeout(() => {
        const left = g.LIM - g.t;
        if (ev) { jailAdd(); return endOp(true, 30 + left / 3, `Interpellé en ${fmt(g.t)} ! ${ev.win}`); }
        const a = arc3(), rec = a.best.poursuite === undefined || g.t < a.best.poursuite; if (rec) a.best.poursuite = g.t;
        jailAdd(); endOp(true, 15 + left / 3, `Voleur interpellé en ${fmt(g.t)} et placé en garde à vue !${rec ? ' 🏆 Nouveau record !' : ''}`);
      }, 1800);
      return;
    }
    if (g.t > g.LIM) return endOp(false, 4, 'Le voleur a réussi à semer la patrouille… La prochaine fois, colle-le de plus près !');
    $('gtxt').textContent = `🚔 ${'▮'.repeat(Math.round(g.bar * 10))}${'▯'.repeat(10 - Math.round(g.bar * 10))} · ⏱ ${Math.ceil(g.LIM - g.t)} s`;
  };
  g.objective = () => ({ x: th.pos.x, z: th.pos.z, txt: g.phase === 'aller' ? ev.title : g.bar > 0 && th.pos.distanceTo(CAR.pos) < 10 ? 'Reste collé ! 🔥' : 'Voiture volée', col: 0xdc2626 });
  g.cleanup = () => { scene.remove(m); if (g.thief) scene.remove(g.thief.root); setSiren(false); };
  th.pos.copy(nodePos(...th.a)); m.position.copy(th.pos);
  { const d = nodePos(...th.b).sub(th.pos); th.yaw = Math.atan2(d.x, d.z); m.rotation.y = th.yaw; }
  if (!ev) setTimeout(() => toast('🚨 Allume le gyrophare : la jauge monte plus vite !'), 2600);
  return g;
}

/* ---------- Déplacements sur la grille des rues (PNJ qui chassent ou fuient) ---------- */
// Cases praticables : rues, trottoirs, parcs. Pas l'accident ni la cellule de garde à vue.
const walkable = (r, c) => 'R.TGV'.includes(at(r, c)) && !(r === 13 && c === 4) && !(r === 4 && c === 4);
const tileOf = p => [Math.round(p.z / T) + 7, Math.round(p.x / T) + 7];
// Distance en cases depuis une position, pour toute la ville
function bfsFrom(p) {
  const [pr, pc] = tileOf(p), D = Array.from({ length: 15 }, () => Array(15).fill(1e9)), q = [[pr, pc]];
  D[pr][pc] = 0;
  while (q.length) { const [r, c] = q.shift(); for (const [dr, dc] of DIRS) { const a = r + dr, b = c + dc; if (a >= 0 && a < 15 && b >= 0 && b < 15 && walkable(a, b) && D[a][b] > D[r][c] + 1) { D[a][b] = D[r][c] + 1; q.push([a, b]); } } }
  return D;
}

/* ---------- 🏃 Poursuite à pied : le voleur à l'arraché ---------- */
function APied(o, ev) {
  if (!ev) putOnFoot(tc(7, 3).x, tc(7, 3).z + 2);
  const thief = new Char(ev ? ev.model : 'character-male-e'); tint(thief, 0x4a4a55);
  MK.thief = MK.thief || markerSprite('#dc2626', '$').material.map;
  MK.tired = MK.tired || markerSprite('#f59e0b', '…').material.map;
  const mk = markerSprite('#dc2626', '$'); mk.position.set(0, 1.25, 0); mk.scale.set(.5, .5, 1); thief.root.add(mk);
  const pos = ev ? ev.pos.clone() : tc(7, 5).add(new THREE.Vector3(0, 0, 1)); thief.root.position.copy(pos); thief.face(P.pos.x, P.pos.z);
  const g = { t: 0, LIM: 60, exitOk: !!ev, carOk: !!ev, cyc: 2.5, tired: false, dist: null, bfsT: 0, done: false, last: null, phase: ev ? 'aller' : 'fuite', wait: 0 };
  g.update = dt => {
    thief.mixer.update(dt);
    if (g.done) return;
    if (FREEZE) { thief.play('idle'); return; }
    if (g.phase === 'aller') {   // appel radio : il traîne sur place jusqu'à ce qu'on approche
      const d = pos.distanceTo(P.pos); thief.play('idle'); g.wait += dt;
      mk.position.y = 1.25 + Math.sin(t0 * 3) * .05;
      $('gtxt').textContent = `📻 ${ev.title} · ${Math.round(d)} m`;
      if (g.wait > 300) return endOp(false, 0, 'Trop tard : le suspect a quitté les lieux. Une autre patrouille prend le relais.');
      if (d < 14) {
        if (P.inCar) { if (!g.warned) { g.warned = true; toast('🚶 Descends de la voiture : l\'interpellation se fait à pied !'); } return; }
        g.phase = 'fuite'; g.exitOk = g.carOk = false; toast(ev.flee); buzz(60); tone(880, .1); tone(660, .15, 'square', .08, .1);
      }
      return;
    }
    g.t += dt;
    // le voleur alterne sprints et coups de fatigue : c'est là qu'il faut le rattraper
    g.cyc -= dt;
    if (g.cyc <= 0) { g.tired = !g.tired; g.cyc = g.tired ? 1.5 : 2.6 + Math.random(); mk.material.map = g.tired ? MK.tired : MK.thief; mk.material.needsUpdate = true; }
    g.bfsT -= dt; if (g.bfsT <= 0) { g.dist = bfsFrom(P.pos); g.bfsT = .25; }
    const near = pos.distanceTo(P.pos);
    // fuite vers la case voisine la plus loin du joueur (un peu de hasard pour qu'il ne soit pas prévisible)
    const [r, c] = tileOf(pos); let tgt = null, bd = -1;
    for (const [dr, dc] of DIRS) {
      const a = r + dr, b = c + dc; if (!walkable(a, b) || g.dist[a][b] >= 1e9) continue;
      const d = g.dist[a][b] + Math.random() * .6 + (isRoad(a, b) ? .8 : 0) + (g.last && g.last[0] === a && g.last[1] === b ? .5 : 0);
      if (d > bd) { bd = d; tgt = [a, b]; }
    }
    if (tgt) g.last = tgt;
    const goal = tgt ? tc(...tgt) : pos.clone().add(pos.clone().sub(P.pos).setY(0).normalize());
    const here = tc(r, c), toT = goal.clone().sub(pos);
    if (tgt) { if (Math.abs(goal.x - here.x) > 1) toT.z = (here.z - pos.z) * 4; else toT.x = (here.x - pos.x) * 4; }
    toT.y = 0; const l = toT.length();
    const sp = g.tired ? 4.5 : near > 25 ? 5.5 : 7.3;
    if (l > .01) { pos.addScaledVector(toT, Math.min(sp * dt, l) / l); thief.root.rotation.y += angDiff(thief.root.rotation.y, Math.atan2(toT.x, toT.z)) * Math.min(1, dt * 12); }
    collide(pos, .35); thief.root.position.copy(pos); thief.play(g.tired ? 'walk' : 'sprint');
    mk.position.y = 1.25 + Math.sin(t0 * 8) * .05;
    if (near < 1.3) {
      g.done = true; FREEZE = true; thief.play('emote-no'); thief.face(P.pos.x, P.pos.z); player.face(pos.x, pos.z); player.play('interact-right');
      SFX.win(); buzz([40, 30, 40]); toast('🚔 Menotté ! Direction la garde à vue.');
      setTimeout(() => {
        const left = g.LIM - g.t;
        if (ev) { jailAdd(); return endOp(true, 25 + left / 3, `Interpellé en ${fmt(g.t)} ! ${ev.win}`); }
        const a = arc3(), rec = a.best.pied === undefined || g.t < a.best.pied; if (rec) a.best.pied = g.t;
        jailAdd(); endOp(true, 12 + left / 2.5, `Voleur rattrapé et menotté en ${fmt(g.t)} ! Le sac est rendu à sa propriétaire.${rec ? ' 🏆 Nouveau record !' : ''}`);
      }, 1500);
      return;
    }
    if (near > 55) return endOp(false, 3, 'Le voleur t\'a semé dans les ruelles… Profite de ses moments d\'essoufflement (…) pour le rattraper !');
    if (g.t > g.LIM) return endOp(false, 3, 'Le voleur s\'est volatilisé. Coupe-lui la route par les trottoirs la prochaine fois !');
    $('gtxt').textContent = `🏃 ${Math.round(near)} m · ⏱ ${Math.ceil(g.LIM - g.t)} s${g.tired ? ' · 😮‍💨 essoufflé !' : ''}`;
  };
  g.objective = () => ({ x: pos.x, z: pos.z, txt: g.phase === 'aller' ? ev.title : g.tired ? 'Il fatigue, fonce ! 🔥' : ev ? 'Suspect en fuite' : 'Voleur à l\'arraché', col: 0xdc2626 });
  g.cleanup = () => { scene.remove(thief.root); };
  if (!ev) setTimeout(() => toast('👜 « Au voleur ! Il a pris mon sac ! » - Pousse le joystick à fond pour sprinter'), 2700);
  return g;
}

/* ---------- 🕵️ Les faux chefs : Pac-BC en 3D ---------- */
function Chefs() {
  putOnFoot(tc(7, 7).x + 2, tc(7, 7).z + 2);
  const g = { score: 0, hearts: 3, inv: 0, rev: 0, items: [], stars: [], chefs: [], dist: null, bfsT: 0, exitOk: true, carOk: false, t: 0 };
  const fGeo = new THREE.BoxGeometry(.7, .1, .5), fMat = new THREE.MeshLambertMaterial({ color: 0xf4c430, emissive: 0x6b4f00 });
  for (let r = 0; r < 15; r++) for (let c = 0; c < 15; c++) {
    if (!isRoad(r, c) || !walkable(r, c) || (r === 7 && c === 7)) continue;
    const corner = RC.includes(r) && RC.includes(c) && r !== 7 && c !== 7;
    const p = tc(r, c);
    if (corner) { const s = markerSprite('#d4af37', '★'); s.position.set(p.x, 1.2, p.z); s.material.depthTest = true; scene.add(s); g.stars.push(s); }
    else { const f = new THREE.Mesh(fGeo, fMat); f.position.set(p.x, .6, p.z); f.rotation.y = rnd() * 6; f.castShadow = true; scene.add(f); g.items.push(f); }
  }
  g.total = g.items.length;
  const SP = [[1, 7], [7, 13], [13, 7], [7, 1]];
  ['character-male-d', 'character-female-d', 'character-male-b', 'character-female-b'].forEach((mdl, i) => {
    const ch = new Char(mdl); tint(ch, 0xffffff);
    const mk = markerSprite('#002395', 'C'); mk.position.set(0, 1.25, 0); mk.scale.set(.5, .5, 1); ch.root.add(mk);
    const home = tc(...SP[i]); ch.root.position.copy(home); ch.play('walk');
    g.chefs.push({ ch, mk, home, pos: home.clone(), wait: 2 + i * 3, caught: false });
  });
  const bfs = () => { g.dist = bfsFrom(P.pos); };
  const reveal = on => {
    g.chefs.forEach(c => { tint(c.ch, on ? 0x4a4a55 : 0xffffff); c.mk.material.map = on ? MK.thief : MK.chef; c.mk.material.needsUpdate = true; });
  };
  MK.chef = MK.chef || markerSprite('#002395', 'C').material.map; MK.thief = MK.thief || markerSprite('#dc2626', '$').material.map;
  g.update = dt => {
    g.items.forEach(f => { f.rotation.y += dt * 2; f.position.y = .6 + Math.sin(t0 * 3 + f.position.x) * .1; });
    if (FREEZE) return; g.t += dt;
    if (g.inv > 0) { g.inv -= dt; player.root.visible = Math.floor(g.inv * 10) % 2 === 0; } else player.root.visible = true;
    if (g.rev > 0) { g.rev -= dt; if (g.rev <= 0) { reveal(false); toast('Les « chefs » remettent leur déguisement !'); } }
    // ramassage
    for (let i = g.items.length - 1; i >= 0; i--) if (Math.hypot(g.items[i].position.x - P.pos.x, g.items[i].position.z - P.pos.z) < 1.6) { scene.remove(g.items[i]); g.items.splice(i, 1); g.score += 10; tone(1100, .05, 'square', .05); }
    for (let i = g.stars.length - 1; i >= 0; i--) if (Math.hypot(g.stars[i].position.x - P.pos.x, g.stars[i].position.z - P.pos.z) < 1.8) {
      scene.remove(g.stars[i]); g.stars.splice(i, 1); g.score += 50; g.rev = 8; reveal(true); SFX.win(); buzz(50);
      toast('★ MANDAT ! Ce ne sont pas des chefs… ce sont des voleurs ! Attrape-les !');
    }
    if (!g.items.length) {
      const a = arc3(), rec = a.best.chefs === undefined || g.score > a.best.chefs; if (rec) a.best.chefs = g.score;
      return endOp(true, 12 + g.score / 40, `Tous les dossiers sont récupérés ! Score : ${g.score} pts.${rec ? ' 🏆 Nouveau record !' : ''}`);
    }
    // les « chefs »
    g.bfsT -= dt; if (g.bfsT <= 0) { bfs(); g.bfsT = .25; }
    const speed = 4.3 + Math.min(1.4, g.t / 60);
    for (const c of g.chefs) {
      c.ch.mixer.update(dt);
      if (c.wait > 0) { c.wait -= dt; c.ch.play('idle'); continue; }
      const [r, cc] = tileOf(c.pos), [pr, pc] = tileOf(P.pos);
      let tgt;
      if (g.rev > 0) {   // fuite : vers la case voisine la plus loin du joueur
        let bestD = -1; for (const [dr, dc] of DIRS) { const a = r + dr, b = cc + dc; if (walkable(a, b) && g.dist[a][b] > bestD && g.dist[a][b] < 1e9) { bestD = g.dist[a][b]; tgt = tc(a, b); } }
      } else if (r === pr && cc === pc) tgt = P.pos;
      else { let bestD = 1e9; for (const [dr, dc] of DIRS) { const a = r + dr, b = cc + dc; if (walkable(a, b) && g.dist[a][b] < bestD) { bestD = g.dist[a][b]; tgt = tc(a, b); } } }
      if (!tgt) tgt = P.pos;
      // centrer dans le couloir avant de tourner
      const here = tc(r, cc), toT = tgt.clone().sub(c.pos);
      if (tgt !== P.pos) { if (Math.abs(tgt.x - here.x) > 1) toT.z = (here.z - c.pos.z) * 4; else toT.x = (here.x - c.pos.x) * 4; }
      toT.y = 0; const l = toT.length();
      if (l > .01) { const v = (g.rev > 0 ? speed * .8 : speed) * dt; c.pos.addScaledVector(toT, Math.min(v, l) / l); c.ch.root.rotation.y = Math.atan2(toT.x, toT.z); }
      collide(c.pos, .35); c.ch.root.position.copy(c.pos); c.ch.play('sprint');
      if (c.pos.distanceTo(P.pos) < 1.1) {
        if (g.rev > 0) {
          g.score += 100; jailAdd(); c.pos.copy(c.home); c.wait = 5; SFX.win(); toast('🔒 Un faux chef en garde à vue ! +100');
        } else if (g.inv <= 0) {
          g.hearts--; g.inv = 2.2; SFX.ko(); buzz([80, 40, 80]);
          g.chefs.forEach((o, i) => { o.pos.copy(o.home); o.wait = 1.5 + i; });
          if (g.hearts <= 0) return endOp(false, g.score / 60, `Attrapé par la « hiérarchie »… Score : ${g.score} pts (${g.total - g.items.length}/${g.total} dossiers).`);
          toast(`Aïe ! Un chef t'a coincé - encore ${g.hearts} ❤️`);
        }
      }
    }
    $('gtxt').textContent = `📁 ${g.total - g.items.length}/${g.total} · ${'❤️'.repeat(g.hearts)} · ${g.score} pts${g.rev > 0 ? ' · ★ ' + Math.ceil(g.rev) : ''}`;
  };
  g.objective = () => {
    let best = null, bd = 1e9; for (const f of g.items) { const d = Math.hypot(f.position.x - P.pos.x, f.position.z - P.pos.z); if (d < bd) { bd = d; best = f; } }
    return best && bd > 10 ? { x: best.position.x, z: best.position.z, txt: 'Dossier le plus proche' } : null;
  };
  g.cleanup = () => { g.items.forEach(f => scene.remove(f)); g.stars.forEach(s => scene.remove(s)); g.chefs.forEach(c => scene.remove(c.ch.root)); player.root.visible = !P.inCar; };
  bfs();
  return g;
}

  { id: 'conges', kind: 'quiz', w: 1, title: 'Congés en urgence', who: 'GPX Lefèvre', role: 'Gardienne de la paix', model: 'character-female-f', themes: ['C'],
    msg: l => `Une collègue a une question urgente sur ses congés ${l}.`,
    intro: ['Ma sœur se marie dans quinze jours et je n\'ai rien posé !', 'J\'ai le droit à quoi, exactement ?'],
    win: 'Super, je vais faire ma demande tout de suite. Merci !', lose: 'Je vais plutôt demander au service RH…' },
  { id: 'equipe', kind: 'quiz', w: 1, title: 'Tension dans l\'équipe', who: 'GPX Roche', role: 'Gardien de la paix', model: 'character-male-e', with: 'character-male-d', themes: ['H'],
    msg: l => `Ça chauffe entre deux collègues ${l}. Un futur chef doit savoir gérer ça.`,
    intro: ['Franchement, avec Dubois, ça ne passe plus.', 'Il ne fait jamais sa part et c\'est toujours moi qui récupère tout.', 'Si t\'étais notre chef, tu ferais quoi ?'],
    win: 'OK… on va essayer comme ça. Merci d\'avoir pris le temps.', lose: 'Ça ne règle pas vraiment le problème…' },
  { id: 'desoriente', kind: 'quiz', w: 1, title: 'Personne âgée désorientée', who: 'Mme Petitjean', role: 'Passante', model: 'character-female-c', themes: ['I', 'G'],
    msg: l => `Une personne âgée semble perdue ${l}.`,
    intro: ['Excusez-moi, monsieur l\'agent… je ne retrouve plus ma rue.', 'Je suis sortie acheter du pain et puis… plus rien.'],
    win: 'Merci, vous êtes bien aimable. Ma fille arrive me chercher.', lose: 'Je… je ne sais toujours pas où je suis…' }
];
const placeName = (r, c) => r === 1 ? 'avenue du Nord' : r === 13 ? 'boulevard Sud' : r === 7 ? 'avenue Centrale'
  : c === 1 ? 'rue de l\'Ouest' : c === 13 ? 'rue de l\'Est' : c === 7 ? 'rue du Marché' : 'dans le quartier';
const CALL_MIN = 600, CALL_MAX = 1200;   // secondes de jeu entre deux appels
const callDelay = () => CALL_MIN + Math.random() * (CALL_MAX - CALL_MIN);
if (typeof S.d3.callT !== 'number') S.d3.callT = callDelay();
if (S.d3.calls === undefined) S.d3.calls = true;

function callTick(dt) {
  if (!S.d3.calls || GAME || FREEZE || uiOpen() || !S.d3.intro) return;
  const before = S.d3.callT; S.d3.callT -= dt;
  if (Math.floor(before / 15) !== Math.floor(S.d3.callT / 15)) save();   // le compte à rebours survit à une fermeture du jeu
  if (S.d3.callT <= 0) { S.d3.callT = callDelay(); save(); offerCall(); }
}
function pickCall() {
  const tot = CALLS.reduce((s, c) => s + c.w, 0); let x = Math.random() * tot;
  for (const c of CALLS) { x -= c.w; if (x <= 0) return c; }
  return CALLS[0];
}
// Une rue loin du joueur (pas sur l'accident)
function callTile(minD = 35) {
  const cand = [];
  for (let r = 0; r < 15; r++) for (let c = 0; c < 15; c++)
    if (isRoad(r, c) && walkable(r, c) && !(r === 13 && c >= 3 && c <= 5) && tc(r, c).distanceTo(P.pos) > minD) cand.push([r, c]);
  return cand[Math.floor(Math.random() * cand.length)] || [7, 7];
}
function offerCall(c = pickCall()) {
  let ev, lieu;
  if (c.kind === 'voiture') {
    const nodes = []; for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) if (nodePos(i, j).distanceTo(P.pos) > 40) nodes.push([i, j]);
    const a = nodes[Math.floor(Math.random() * nodes.length)] || [0, 0];
    const nb = [[a[0] - 1, a[1]], [a[0] + 1, a[1]], [a[0], a[1] - 1], [a[0], a[1] + 1]].filter(([x, y]) => x >= 0 && x < 3 && y >= 0 && y < 3 && !(a[0] === 2 && x === 2 && a[1] + y === 1));
    ev = { a, b: nb[Math.floor(Math.random() * nb.length)] }; lieu = placeName(RC[a[0]], RC[a[1]]);
  } else {
    const [r, c2] = callTile(), p = tc(r, c2);
    // sur le trottoir, pas au milieu de la chaussée
    if (RC.includes(r) && !RC.includes(c2)) p.z += 2.8; else if (RC.includes(c2) && !RC.includes(r)) p.x += 2.8;
    ev = { pos: p, model: THIEF_MODELS[Math.floor(Math.random() * THIEF_MODELS.length)] }; lieu = placeName(r, c2);
  }
  Object.assign(ev, { title: c.title, flee: c.flee, win: c.win, c });
  const where = lieu.startsWith('dans') ? lieu : (/^(avenue|rue)/.test(lieu) ? 'dans l\'' : 'sur le ') + lieu;
  const txt = c.msg(where.replace('dans l\'avenue', 'avenue').replace('dans l\'rue', 'rue').replace(/^(avenue|rue)/, 'sur l\'$1').replace('sur l\'rue', 'rue'));
  [0, .18, .36].forEach(t => tone(1200, .08, 'square', .05, t)); buzz([120, 80, 120]);
  dialog([['📻 Central', 'Appel radio - ' + c.title, txt + ' Tu prends l\'appel ?',
    [['🚨 J\'y vais', () => startCall(c, ev)], ['Pas maintenant', () => toast('📻 Bien reçu, une autre patrouille s\'en charge.'), 'alt']]]]);
}
function startCall(c, ev) {
  if (GAME) return;
  const op = { id: 'appel', name: c.title };
  GAME = ({ pied: APied, voiture: Poursuite, quiz: CallQuiz })[c.kind](op, ev);
  Object.assign(GAME, { op, name: c.title, nocap: true, hdr: '📻 Central' });
  $('ghud').classList.remove('hidden');
  toast('📻 La flèche te guide jusqu\'au lieu de l\'appel.');
}
// Mission « requérant » : on va à sa rencontre, il explique son problème, et on répond à 3 questions du thème
function CallQuiz(o, ev) {
  const c = ev.c, base = ev.pos, extra = [];
  const ch = new Char(c.model); ch.root.position.copy(base); ch.play('idle');
  const mk = markerSprite('#f59e0b', '!'); mk.position.set(0, 1.25, 0); mk.scale.set(.6, .6, 1); ch.root.add(mk);
  if (c.with) {
    const o2 = new Char(c.with); o2.root.position.copy(base).add(new THREE.Vector3(1.5, 0, .6)); o2.face(base.x, base.z); o2.play('idle'); extra.push(o2);
    ch.face(o2.root.position.x, o2.root.position.z);
  }
  const g = { wait: 0, talked: false, exitOk: true, carOk: true };
  g.update = dt => {
    ch.mixer.update(dt); extra.forEach(e => e.mixer.update(dt)); mk.position.y = 1.25 + Math.sin(t0 * 3) * .06;
    const d = ch.root.position.distanceTo(P.pos);
    if (d < 6 && !P.inCar) ch.root.rotation.y += angDiff(ch.root.rotation.y, Math.atan2(P.pos.x - base.x, P.pos.z - base.z)) * Math.min(1, dt * 4);
    if (!g.talked) { g.wait += dt; if (g.wait > 300) return endOp(false, 0, 'L\'appel a été transféré à une autre patrouille.'); }
    $('gtxt').textContent = `📻 ${c.title} · ${Math.round(d)} m`;
  };
  g.actLabel = () => !g.talked && !P.inCar && ch.root.position.distanceTo(P.pos) < 3.2 ? 'Parler' : null;
  g.onAct = () => {
    const L = c.intro.map(t => [c.who, c.role, t]), last = L[L.length - 1];
    L[L.length - 1] = [last[0], last[1], last[2], [['C\'est parti !', () => {
      g.talked = true; mk.visible = false;
      startQuiz({ id: 'appel', who: c.who, role: c.role, themes: c.themes, n: 3, need: 2,
        onEnd: (win, ok) => endOp(win, win ? 25 : 2, `${c.who} : « ${win ? c.win : c.lose} »  (${ok}/3 bonnes réponses)`) });
    }], ['Plus tard', null, 'alt']]];
    dialog(L);
  };
  g.objective = () => g.talked ? null : { x: base.x, z: base.z, txt: c.title, col: 0xf59e0b };
  g.cleanup = () => { scene.remove(ch.root); extra.forEach(e => scene.remove(e.root)); };
  return g;
}
function callsBtn() { $('mCalls').textContent = S.d3.calls ? '📻 Appels radio aléatoires : activés' : '📻 Appels radio aléatoires : coupés'; }
$('mCalls').addEventListener('click', () => { S.d3.calls = !S.d3.calls; save(); callsBtn(); toast(S.d3.calls ? '📻 Appels radio réactivés : le prochain arrive dans un moment.' : '📻 Plus d\'appels radio aléatoires.'); });

/* =========================================================
   DÉMARRAGE
   ========================================================= */
(async () => {
  try { await loadAll(); }
  catch (e) { $('loadTxt').textContent = 'Erreur de chargement : ' + e.message; return; }
  MK.todo = markerSprite('#f4c430', '!').material.map; MK.done = markerSprite('#16a34a', '✓').material.map;
  buildWorld();
  camLook.copy(P.pos); camPos.set(P.pos.x, 17, P.pos.z + 17);
  $('loading').classList.add('hidden'); ['hud', 'obj'].forEach(id => $(id).classList.remove('hidden'));
  hud(); loop();
  window.__g3 = { THREE, scene, camera, renderer, P, CAR, S, SPOTS, get QZ() { return QZ; }, get GAME() { return GAME; }, OPS, startOp, R, input, CALLS, offerCall, step(n) { for (let i = 0; i < n; i++) update(1 / 30); renderer.render(scene, camera); } };
  if (!S.d3.intro) { $('joyHint').classList.remove('hidden'); dialog(STORY_INTRO.map(l => l.slice()), () => { S.d3.intro = true; save(); }); }
  else { const n = nextMission(); toast(n ? '📻 Prochain dossier : ' + n.place : '🎖️ Bon retour, Brigadier-Chef !'); }
})();
</script>
